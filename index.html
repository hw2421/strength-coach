{n:'04',t:'容量：MEV / MRV 与修正',sub:'两个界标之间才是可工作的区间，基准组数只是起点估计。',
 pts:[['MEV 与 MRV','分别描述产生足够效果的起点与可恢复上限，两者之间构成可工作区间。'],
  ['基准组数要修正','作者按评估因素给加减项；这些是起始估计，不是测量得到的个人生理常数。'],
  ['恢复条件同时影响两端','饮食、睡眠与压力既改变刺激需求，也改变恢复余地，不能只按力量等级加组。'],
  ['不同阶段的组数不可直接比较','增肌期与冲刺期的组数含义不同，横向对比会得出错误结论。'],
  ['校准依据','实际表现、技术稳定度与恢复趋势，才是修订组数的依据。']],
 chs:['jts-c04']},
{n:'05',t:'频率与训练周',sub:'先分任务类型，再把周量放进可用的训练日。',
 pts:[['两种次数要分开算','需要多少次高压力训练，与需要多少次技术接触，是两个问题。'],
  ['三大项成本不同','肌肉、神经与结缔组织的恢复成本不一样，不能把三项视为同等负担。'],
  ['提高频率不必提高总量','把已有周量重新分摊到更多训练日，往往比单纯加量更有效。'],
  ['可持续执行是设计条件','时间限制与生活安排决定结构；纸面最优但执行不了的计划没有价值。']],
 chs:['jts-c05']},
{n:'06',t:'训练单元与三大项弱点',sub:'同一个现象可能有不同原因，先定位再选变式。',
 pts:[['阶段决定单元重点','增肌期重视刺激与容量；增力与冲刺期逐步提高与比赛动作的关联。'],
  ['定向适应与适应抵抗','连续练习才能产生定向适应；出现抵抗时再考虑变化，两者需要平衡。'],
  ['深蹲的四类问题','上背、起底、平行附近、负重信心——对应不同变式，不能只用多蹲解决。'],
  ['卧推的三段','底部、中程、锁定各有目的；暂停、Spoto、握距变化与辅助增肌要放进整套周量。'],
  ['硬拉的四段','离地、膝附近、锁定与握力分别检查；变式应针对失速之前的过程。'],
  ['不能只按外形开动作','同样前倾可能有不同原因；先看轻重量、不同阶段是否同样出现。'],
  ['机械超负荷要计价','特殊器械提高承重暴露，也增加压力；价值不能只看举得更重。']],
 chs:['jts-c06','clinic-c03','clinic-c04','clinic-c05']},
{n:'07',t:'中周期：交替与低中高模型',sub:'把高压力暴露分开，让三项的疲劳不要同时堆积。',
 pts:[['周期长度的依据','取决于 MEV 到 MRV 之间可用空间、阶段目标与个人恢复。'],
  ['交替模型','不同训练日或动作承担不同压力，避免同一天把多个高成本任务叠在一起。'],
  ['低中高模型','把周内负荷分层：低日给技术与恢复，中日给容量，高日给强度检验。'],
  ['重量选择的三项输入','既往表现、当日感受与阶段要求；某次状态特别好，不等于应立即打乱进程。'],
  ['比较同角色单元','看相同功能的训练单元是否进步，而不是要求每次训练都高于上一次。'],
  ['模块之间的衔接','进入下一模块要区分继续同一目标与切换目标，起点不必沿用旧阶段最后一周。']],
 chs:['jts-c07']},
{n:'08',t:'阶段增益与六个样例',sub:'前一阶段为后一阶段创造潜力，样例展示的是推导而不是处方。',
 pts:[['阶段之间是增益关系','增肌提高增力的潜力，增力提高冲刺的潜力；后期仍保留必要的基础刺激。'],
  ['六种资料，六种结构','部分样例使用多个增肌模块，另一些缩短甚至略过真正的增肌阶段——结构由需求决定，不由日历决定。'],
  ['高水平情境更依赖交替','用交替负荷与不同推进方式，控制单次高压力的成本。'],
  ['百分比要辨分母','基于某次重复最大值的百分比与基于 1RM 的百分比不是一回事，复制前必须看清。'],
  ['样例的用法','价值在于展示资料到参数的推理链，而不是提供可照抄的重量表。']],
 chs:['jts-c08','jts-c09']},
{n:'09',t:'诊断手册与使用边界',sub:'动作现场的问题处理，以及这套体系不该被用来做什么。',
 pts:[['热身','围绕升温、相关肌群与动作准备；不能让热身消耗掉正式训练能力。'],
  ['深蹲与卧推的现场检查','深蹲先看上背紧张、出杠与站姿；卧推先看上背与脚部支撑，起杠、下降、触点、推起是一条连续链。'],
  ['硬拉的个体差异','肢段与杠杆决定设置外观；传统与相扑不应使用同一个髋高模板。'],
  ['装备与辅助的次序','腰带护膝取决于阶段与比赛需求；辅助训练放在主项之后，不为辅助纪录牺牲主项恢复。'],
  ['训练与医疗的边界','手册明确划出训练指导与伤病诊疗的界限；没有检查不能凭动作描述生成康复诊断。'],
  ['不要从扫描表格重建重量','扫描件存在识别噪声，精确重量表不可靠；应学习推导方法而非复制数字。']],
 chs:['clinic-c02','clinic-c06','clinic-c07']}
];

const BASICS=[
{n:'01',t:'能力与目标',sub:'先分清练的是什么，再决定怎么练。',ids:['strength','specific','goal']},
{n:'02',t:'刺激与适应',sub:'刺激有收益，也有成本。',ids:['adapt','volume']},
{n:'03',t:'剂量的四个旋钮',sub:'容量、强度、努力、频率，互相影响但不可互换。',ids:['dose','rpe']},
{n:'04',t:'阶段与组织',sub:'重点轮换，而不是所有能力同时最大化。',ids:['period','frequency']},
{n:'05',t:'体系与模型',sub:'体系是工具箱；模型有共识，也有分歧。',ids:['systems','model-limits']},
{n:'06',t:'教学与动作学习',sub:'整体—分解—整体，以及辅助动作的迁移。',ids:['teach-whole','press-clean']}
];

function chapterBtns(ids){return (ids||[]).map(id=>{const c=chapOf(id);return c?`<button class="smallbtn" data-chapter="${id}">${esc(c.title)}</button>`:''}).join('')}

function jtsView(){const cs=CHAPTERS.filter(c=>c.book==='jts'||c.book==='clinic');
return intro('JTS 体系','Chad Wesley Smith / Juggernaut Training Systems：从运动员评估推导计划，再用诊断手册处理动作现场问题。两本手册全部归入本模块。','JUGGERNAUT / JTS 体系')
+`<div class="jtsmeta"><div><b>2</b><span>本手册</span></div><div><b>${cs.length}</b><span>章</span></div><div><b>${cs.reduce((t,c)=>t+c.points.length,0)}</b><span>个要点</span></div></div>`
+JTS_SECTIONS.map(x=>`<div class="toolbox jtsbox"><h2>${x.n} · ${x.t}</h2><p class="tablenote">${x.sub}</p><ul class="ptlist">${x.pts.map(([t,d])=>`<li><b>${t}</b>${d}</li>`).join('')}</ul><div class="linkbtns">${chapterBtns(x.chs)}</div></div>`).join('')
+`<div class="message"><b>怎么用</b><br>先按 01–02 把自己的输入列清楚，再用 03–05 推出阶段、容量与频率，最后用 06–08 填动作与中周期。诊断手册（09）留到具体动作出问题时查。</div>`}

function basicsView(){return intro('基础逻辑','所有模块共用的底层判断：能力、刺激、剂量、阶段、体系与教学。','FOUNDATIONS / 基础逻辑')
+BASICS.map(x=>`<div class="toolbox"><h2>${x.n} · ${x.t}</h2><p class="tablenote">${x.sub}</p><div class="linkbtns">${x.ids.map(artBtn).join('')}</div></div>`).join('')
+`<div class="message"><b>怎么用</b><br>动作页告诉你这一组做对没有，本模块告诉你为什么要这样安排。两者冲突时，先回到能力与目标。</div>`}

function liftBlock(id){const L=LIFTS[id];if(!L)return '';
return `<section class="liftsec" id="sec-${id}"><div class="liftcover"><span class="eyebrow">${L.en}</span><h2>${L.name}</h2><p>${L.intro}</p></div>`
+`<div class="toolbox"><h2>① 动作标准</h2>${L.groups.map(g=>`<h3 class="ckgroup">${g.t}</h3><ul class="checklist">${g.items.map(c=>`<li>${c}</li>`).join('')}</ul>`).join('')}</div>`
+`<div class="toolbox"><h2>② 分步学习法</h2><ol class="steplist">${L.steps.map(([t,d])=>`<li><b>${t}</b>${d}</li>`).join('')}</ol></div>`
+`<div class="toolbox"><h2>③ 易错点 · 常见误区 · 如何修正</h2><div class="tablewrap"><table class="cmp"><thead><tr><th>易错点</th><th>常见误区</th><th>如何修正</th></tr></thead><tbody>${TECH_ERR[id].rows.map(r=>`<tr>${r.map((c,i)=>`<td${i===0?' class="rowhead"':''} data-label="${['易错点','常见误区','如何修正'][i]}">${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div></div>`
+`<div class="toolbox"><h2>④ 卡点诊断</h2><p class="tablenote">先按失速位置定位，再往下查设置与前段；不要直接跳到"某块肌肉弱"。</p><div class="tablewrap"><table class="cmp"><thead><tr><th>卡点</th><th>先查什么</th><th>修正方向</th></tr></thead><tbody>${L.diag.map(r=>`<tr>${r.map((c,i)=>`<td${i===0?' class="rowhead"':''} data-label="${['卡点','先查什么','修正方向'][i]}">${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div></div>`
+`<div class="toolbox"><h2>⑤ 弱点纠正动作</h2><div class="tablewrap"><table class="cmp"><thead><tr><th>动作</th><th>针对</th><th>怎么用</th></tr></thead><tbody>${L.fixes.map(r=>`<tr>${r.map((c,i)=>`<td${i===0?' class="rowhead"':''} data-label="${['动作','针对','怎么用'][i]}">${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div></div>`
+`<div class="toolbox"><h2>⑥ 常见变式与用途</h2><div class="tablewrap"><table class="cmp"><thead><tr><th>变式</th><th>用途</th></tr></thead><tbody>${L.vars.map(r=>`<tr>${r.map((c,i)=>`<td${i===0?' class="rowhead"':''} data-label="${['变式','用途'][i]}">${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div></div>`
+`<div class="toolbox"><h2>⑦ 训练安排</h2><p><b>新手</b>${L.plan.b}</p><p><b>中级</b>${L.plan.m}</p><p><b>高级</b>${L.plan.a}</p></div>`
+`<div class="toolbox"><h2>⑧ 相关资料</h2><div class="linkbtns"><button class="smallbtn" data-article="${L.model}">${L.name}模型条目</button><button class="smallbtn" data-go="tech">技术知识总览</button><button class="smallbtn" data-go="confuse">易混对照表</button></div></div></section>`}

function liftTabs(){return `<div class="lifttabs liftnav">${['squat','bench','deadlift'].map(id=>`<button data-scroll="sec-${id}" class="${current==='lift:'+id?'on':''}">${LIFTS[id].name}</button>`).join('')}</div>`}
function liftView(id){const L=LIFTS[id];if(!L)return liftsView();return intro(L.name+' · 完整动作页','八个部分：动作标准、分步学习、易错修正、卡点诊断、纠正动作、变式、训练安排、相关资料。','LIFT DETAIL / '+L.en)+liftTabs()+liftBlock(id)}
function liftsView(){return intro('三大项动作系列','深蹲、卧推、硬拉各一整套：标准要点分组 → 分步学习 → 易错与修正 → 卡点诊断 → 纠正动作 → 变式 → 训练安排。','THE BIG THREE / 动作系列')+liftTabs()+['squat','bench','deadlift'].map(liftBlock).join('')}

function home(){return `<div class="welcome"><span class="eyebrow">STRENGTH COACH · 训练知识库</span><h1>从体系到动作，<br><em>从训练到恢复。</em></h1></div><div class="homecards quad">${[['jts','JTS 体系','Chad Wesley Smith · 计划 + 诊断手册',1],['basics','基础逻辑','能力、刺激、剂量、阶段与体系'],['lifts','三大项动作系列','动作标准 · 分步学习 · 易错修正 · 卡点诊断'],['rest','休息恢复','营养与能量 · 训练恢复 · 伤病康复']].map(([id,t,d,hot])=>`<button class="homecard modcard${hot?' jts':''}" data-go="${id}"><strong>${t}</strong><p>${d}</p><span class="modarrow">→</span></button>`).join('')}</div><div class="homesection"><h2>更多资料</h2><div class="linkbtns">${[['tech','技术知识总览'],['path:beginner','学习路线'],['confuse','易混对照'],['books','逐书逐章'],['synthesis','综合主题'],['clinic','动作诊所'],['saved','我的收藏']].map(([id,t])=>`<button class="smallbtn" data-go="${id}">${t}</button>`).join('')}</div></div>`}
function booksView(){return chapterBooks()}
function search(q){return chapterSearch(q)}

document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.go)go(b.dataset.go);else if(b.dataset.scroll){const el=document.getElementById(b.dataset.scroll);if(el)el.scrollIntoView({behavior:'smooth',block:'start'})}else if(b.dataset.path)go('learn');else if(b.dataset.article)openArticle(b.dataset.article);else if(b.dataset.save)toggleArray('saved',b.dataset.save,b);else if(b.dataset.read)toggleArray('done',b.dataset.read,b);else if(b.dataset.notetoggle){let box=document.getElementById('note-'+b.dataset.notetoggle);box.hidden=!box.hidden;b.setAttribute('aria-expanded',!box.hidden);if(!box.hidden)box.querySelector('textarea').focus()}else if(b.dataset.print)printArticle(b.dataset.print);else if(b.dataset.lift){selectedLift=b.dataset.lift;selectedCase=0;view.innerHTML=clinic()}else if(b.dataset.case!==undefined){selectedCase=Number(b.dataset.case);view.innerHTML=clinic()}else if(b.id==='exportNotes'){const blob=new Blob([JSON.stringify({format:'strength-field-notes-v1',saved,done,notes},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='strength-field-notes.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);document.getElementById('exportStatus').textContent='已生成笔记备份下载。'}});
document.addEventListener('input',e=>{const id=e.target.dataset.note;if(!id)return;notes[id]=e.target.value;const ok=write('notes',notes);document.querySelector(`[data-notestatus="${id}"]`).textContent=ok?'已保存在当前浏览器':'无法持久保存，请复制笔记备份。'});
let timer;document.getElementById('search').addEventListener('input',e=>{clearTimeout(timer);let q=e.target.value;timer=setTimeout(()=>search(q),150)});document.getElementById('searchForm').addEventListener('submit',e=>{e.preventDefault();clearTimeout(timer);search(document.getElementById('search').value)});document.getElementById('clearSearch').onclick=()=>{clearTimeout(timer);document.getElementById('search').value='';render()};const initial=decodeURIComponent(location.hash.slice(1));render();if(initial.startsWith('chapter:'))openChapter(initial.slice(8));else if(initial.startsWith('book:')||initial.startsWith('topic:')||['synthesis','conflicts','confuse','books','home','logic','squat','bench','deadlift','recovery','injury','diagnosis','systems','practice','clinic','saved','more','tech','rest','jts','basics','lifts'].includes(initial)||initial.startsWith('lift:')||initial.startsWith('path:'))go(initial);else if(KB.some(a=>a.id===initial))openArticle(initial);

</script></body></html>
