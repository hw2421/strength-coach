/* ===== 顶部返回按钮 ===== */
.backbar{display:none;padding:0 0 14px}
.backbar.on{display:block}
.backbtn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--white);color:var(--ink);border-radius:10px;padding:8px 14px 8px 11px;font-size:13px;font-weight:600;line-height:1}
.backbtn:hover{border-color:var(--forest);color:var(--forest)}
.backbtn i{font-style:normal;font-size:15px;color:var(--forest)}

/* ===== Banner ===== */
.banner{position:relative;margin:0 0 20px;border-radius:16px;overflow:hidden;border:1px solid var(--line);background:#0b1420}
.banner img{display:block;width:100%;height:268px;object-fit:cover;object-position:50% 48%;filter:brightness(.72) contrast(1.08) saturate(1.02)}
.banner::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,20,32,.55) 0%,rgba(11,20,32,.10) 34%,rgba(11,20,32,.55) 66%,rgba(11,20,32,.95) 100%)}
.bannerwrap{position:absolute;left:20px;right:20px;top:16px;display:flex;align-items:flex-start;gap:11px;z-index:2}
.bannerwrap .brandmark{color:#8fe4ea;border-color:#8fe4eaaa;background:rgba(11,20,32,.35)}
.bannerwrap .banner .brandname{color:#fff;text-shadow:0 2px 14px rgba(0,0,0,.55)}
.bannerwrap .banner .brandsub{color:#c8d6e6;text-shadow:0 1px 8px rgba(0,0,0,.5)}

/* ===== 首页卡片层级 ===== */
.homecard.core{border-color:#2f5468;background:linear-gradient(165deg,#16293c 0%,#122133 100%)}
.homecard.core strong{color:#8fe4ea}

/* ===== 底部搜索 ===== */
.bottombar{margin:26px 0 8px;padding:18px 4px 4px;border-top:1px solid var(--line)}
.bottombar .footlabel{font-size:10px;letter-spacing:2px;color:var(--muted);margin-bottom:10px}

/* ===== 窄屏 ===== */
@media(max-width:520px){
 .banner img{height:210px}
 .bannerwrap{left:14px;right:14px;top:13px}
 .backbtn{padding:7px 12px 7px 10px;font-size:12.5px}
}
@media print{.backbar,.bottombar{display:none!important}}

.banner .brandsub{font-size:11px;letter-spacing:1.2px;line-height:1.5;white-space:nowrap;margin-top:2px}
.banner .brandsub.en{font-size:8px;letter-spacing:2px;color:#8ea6bd;opacity:.85;margin-top:1px}
.banner .brandname{font-size:21px;letter-spacing:3px;line-height:1.15;margin-bottom:1px}
.banner .brandmark{width:38px;height:38px;border-radius:11px;font-size:22px;flex:0 0 auto}
@media(max-width:520px){
 .banner .brandname{font-size:19px;letter-spacing:2px}
 .banner .brandsub{font-size:10px}
 .banner .brandsub.en{font-size:7.5px;letter-spacing:1.8px}
 .banner .brandmark{width:34px;height:34px;font-size:19px}
}

.bannerbox[style*="none"] + .brandbar{display:flex}
.brandbar{display:none;align-items:center;gap:9px;margin:0 0 14px;padding:0 2px}
.brandbar .bk{width:30px;height:30px;border:1px solid #4d8b96aa;border-radius:9px;color:#8fe4ea;display:grid;place-items:center;font-size:17px}
.brandbar .bn{font-size:15px;font-weight:750;letter-spacing:2px;color:var(--ink)}
.brandbar .bs{font-size:9px;letter-spacing:1.6px;color:var(--muted);margin-top:1px}

.bottombar .search{width:100%;box-sizing:border-box;margin:0}
.bottombar .search input{width:100%;min-width:0}
.bottombar form{width:100%}
.nav{z-index:50;justify-content:space-around;gap:2px}
.nav button{min-width:0;padding:5px 1px;overflow:hidden;text-overflow:ellipsis}
.nav button span{display:block}

/* ===== 易混对照表 ===== */
.ctable{padding:0;overflow:hidden}
.ctable h2{font-size:16px;letter-spacing:.5px;padding:18px 18px 0;margin:0}
.ctable .tablenote{font-size:12px;color:#b3c4d6;line-height:1.7;padding:8px 18px 14px;margin:0}
.tablewrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border-top:1px solid var(--line)}
table.cmp{width:100%;border-collapse:collapse;font-size:12.5px;min-width:520px}
table.cmp th{background:#14263a;color:#8fdde4;font-weight:700;text-align:left;
  padding:11px 12px;border-bottom:1px solid var(--line);white-space:nowrap;font-size:11.5px;letter-spacing:.5px}
table.cmp td{padding:9px 12px;border-bottom:1px solid #1e2f42;color:#c6d5e6;line-height:1.55;vertical-align:top}
table.cmp td.rowhead{color:#fff;font-weight:700;background:#16283c;white-space:nowrap}
table.cmp tbody tr:last-child td{border-bottom:0}
table.cmp tbody tr:hover td{background:#182b3f}
table.cmp tbody tr:hover td.rowhead{background:#1a2f45}
@media(max-width:520px){
 table.cmp{font-size:12px;min-width:520px}
 table.cmp th,table.cmp td{padding:9px 10px}
 .ctable h2{padding:15px 14px 0;font-size:15px}
 .ctable .tablenote{padding:7px 14px 12px}
}

@media(max-width:700px){
 .tablewrap{overflow:visible;border-top:0}
 table.cmp{min-width:0;width:100%;font-size:12.5px;display:block}
 table.cmp thead{display:none}
 table.cmp tbody{display:block;padding:8px 12px 4px}
 table.cmp tbody tr{display:block;border:1px solid #2b4259;border-radius:10px;
   margin:0 0 10px;padding:2px 0;background:#16273a}
 table.cmp tbody tr:hover td{background:transparent}
 table.cmp td{display:flex;gap:10px;border:0;padding:7px 12px;line-height:1.6}
 table.cmp td::before{content:attr(data-label);flex:0 0 76px;color:#8fb2c4;
   font-size:10.5px;letter-spacing:.5px;font-weight:700;padding-top:2px}
 table.cmp td.rowhead{display:block;background:#1b3048;border-radius:9px 9px 0 0;
   padding:9px 12px;font-size:13.5px;font-weight:750;color:#fff;letter-spacing:.2px;white-space:normal}
 table.cmp td.rowhead::before{content:attr(data-label);display:block;font-size:9.5px;
   letter-spacing:1px;color:var(--muted);margin-bottom:3px;padding-top:0}
 table.cmp td:not(.rowhead){justify-content:flex-start}
 .ctable h2{font-size:15px;padding:16px 14px 0;line-height:1.5}
 .ctable .tablenote{padding:7px 14px 10px;font-size:11.5px}
}

.plainbody p{font-size:13px;line-height:1.8;color:#c7d6e6;margin:0}
.steplist li .linkbtns{margin-top:9px}
@media(max-width:360px){
 .homecard.modcard strong{font-size:18px}
 .homecard.modcard p{font-size:10.5px}
}

/* ===== 动作系列详情 ===== */
.liftnav{position:sticky;top:0;z-index:9;background:var(--paper);padding:10px 0 12px;margin:0 0 4px}
.liftcover{padding:6px 2px 14px}
.liftcover .eyebrow{color:var(--rust);font-size:10px;letter-spacing:2px}
.liftcover h2{font-size:24px;margin:5px 0 8px;color:#9fe8ee}
.liftcover p{font-size:13.5px;line-height:1.85;color:#bccde0;margin:0}
.liftsec{padding-bottom:24px;border-bottom:1px solid var(--line);margin-bottom:24px}
.liftsec:last-child{border-bottom:0}
.ckgroup{font-size:12px;color:var(--rust);letter-spacing:.6px;margin:16px 0 6px;font-weight:700}
.ckgroup:first-of-type{margin-top:2px}
.toolbox h2{letter-spacing:.2px}

/* ===== 四模块首页 ===== */
.homecards.quad{grid-template-columns:repeat(2,1fr);gap:11px}
.homecard.modcard.jts{border-color:#a9853f;background:linear-gradient(165deg,#2a2418 0%,#1a2434 100%)}
.homecard.modcard.jts strong{color:#f0cf95}
.jtsmeta{display:flex;gap:9px;margin:14px 0 4px}
.jtsmeta>div{flex:1;text-align:center;padding:11px 6px;background:var(--white);border:1px solid var(--line);border-radius:11px}
.jtsmeta b{display:block;font-size:19px;color:#f0cf95;line-height:1.4}
.jtsmeta span{font-size:10.5px;color:var(--muted)}
.jtsbox{border-color:#3a4a60}
.ptlist{margin:0;padding:0;list-style:none}
.ptlist li{font-size:13px;line-height:1.85;color:#c7d6e6;padding:11px 0;border-bottom:1px dashed #24384e}
.ptlist li:last-child{border-bottom:0}
.ptlist li b{display:block;color:#e8f1fb;font-size:13.5px;margin-bottom:3px;font-weight:700}

</style></head><body><div class="layout"><header><div id="backbar" class="backbar"></div><div id="bannerbox" class="bannerbox"><div class="banner"><img src="banner.jpg" alt="力量训练" loading="eager"><div class="bannerwrap"><div class="brandmark">Ⅱ</div><div><div class="brandname">力的秩序</div><div class="brandsub">力量训练知识库</div><div class="brandsub en">TRAIN WITH UNDERSTANDING</div></div></div></div></div><div id="brandbar" class="brandbar"><span class="bk">Ⅱ</span><div><div class="bn">力的秩序</div><div class="bs">STRENGTH LIBRARY</div></div></div></header><main><div class="topbar"></div><div id="view"></div><footer class="footer"><span>理解原理 · 稳定动作 · 观察反馈 · 持续调整</span><span>训练知识用于学习与决策；症状评估不代替临床检查。</span></footer><div class="bottombar"><div class="footlabel">SEARCH / 搜索</div><form class="search" id="searchForm" role="search"><span>⌕</span><input id="search" aria-label="搜索知识库" placeholder="搜索章节与主题：臀先起、触点、卡点、疲劳…"><button type="button" id="clearSearch" aria-label="清除搜索">×</button></form></div></main></div><nav class="nav" id="nav" aria-label="主导航"></nav><script>const CHAPTERS=[{"id": "hyp-c01", "book": "hypertrophy", "title": "第1章 · 特异性", "pages": "12–24", "scope": "定向适应、训练兼容性、干扰效应、需求分析", "points": [{"tags": ["goal"], "text": "所有训练都应直接或间接服务于增肌目标；想练腿却只练手臂，任何其他原则都无法修正这种方向性错误。"}, {"tags": ["variation", "period"], "text": "训练兼容性：目标越多，每个目标的训练效果越差；干扰程度取决于结构差异、刺激相似性、卡路里消耗与疲劳破坏性四个因素。"}, {"tags": ["assessment"], "text": "需求分析两步：先列出目标所需的一般要素，再对照个人优势与劣势；这是后续所有剂量决策的前提。"}], "limit": ""},{"id": "hyp-c02", "book": "hypertrophy", "title": "第2章 · 超负荷", "pages": "25–81", "scope": "刺激因子排序、有效刺激范围、RSM、MEV/MRV", "points": [{"tags": ["dose", "intensity"], "text": "细胞肥大刺激因子按重要性排序：张力、运动量、相对努力、动作幅度（ROM）、代谢产物积累、细胞肿胀、神经-肌肉链接、动作速度、肌肉破坏。"}, {"tags": ["dose"], "text": "有效刺激范围：相对努力 5-0 RIR（越接近力竭收益越高但疲劳代价越大）；张力 30%–85% 1RM 均可产生最佳肥大刺激，不必追求大重量。"}, {"tags": ["dose", "assessment"], "text": "单次刺激用 RSM 评估：神经-肌肉链接、泵感、肌肉破坏各打 0–3 分，三项相加；刺激量低于阈值生长很少，超过 MRV 则多余部分只带来疲劳。"}, {"tags": ["adaptation"], "text": "MEV/MAV/MRV 是随训练年限、肌群和生活条件浮动的区间概念，用于校准渐进超负荷节奏，而不是固定处方。"}], "limit": ""},{"id": "hyp-c03", "book": "hypertrophy", "title": "第3章 · 疲劳管理", "pages": "84–116", "scope": "局部/系统性/轴向疲劳、SFR、疲劳预防与减缓", "points": [{"tags": ["fatigue", "recovery"], "text": "运动表现是衡量疲劳最重要的指标：表现未下降的疲劳可继续训练；表现连续下降或骤降才需减量恢复。"}, {"tags": ["dose", "fatigue"], "text": "SFR = 肌肉肥大刺激 − 疲劳程度；分子用 RSM（神经-肌肉链接 0–3、泵感 0–3、肌肉破坏 0–3），分母考虑关节破坏、延续性疲劳和对未训练能力的影响。"}, {"tags": ["period", "recovery"], "text": "疲劳预防靠运动量界标、动作技术选择与波动式微周期；疲劳减缓靠休息日、恢复课、主动降负荷周与积极休息期——预防优先于减缓。"}, {"tags": ["fatigue"], "text": "轴向疲劳（脊柱承受的）虽属局部，却会拖累大量使用竖脊肌的动作，安排容量时要单独计价。"}], "limit": ""},{"id": "hyp-c04", "book": "hypertrophy", "title": "第4章 · 刺激—恢复—适应（SRA）", "pages": "117–144", "scope": "FSR 曲线与恢复曲线、训练频率设计", "points": [{"tags": ["recovery", "adaptation"], "text": "SRA 曲线可拆为肌肉生长（FSR）曲线与恢复曲线：恢复完成不等于生长窗口关闭，二者不同步，所以不必等“完全不酸痛”再练。"}, {"tags": ["frequency", "dose"], "text": "实践推荐：每个肌群每周训练 2–4 次、每次 3–8 组时 SFR 最佳；高频小容量与低频大容量各有适用场景。"}, {"tags": ["variation"], "text": "刺激持续时间与破坏性决定 SRA 长短：重机械应力（大重量深蹲/硬拉）SRA 更长，轻刺激（泵感训练）恢复更快、可更高频率。"}], "limit": ""},{"id": "hyp-c05", "book": "hypertrophy", "title": "第5章 · 多样化", "pages": "145–167", "scope": "刺激多样性、动作更换、长期防停滞", "points": [{"tags": ["variation"], "text": "长期使用完全相同的刺激会导致适应平台；多样化不等于随机换动作，而是有目的地更换刺激类型。"}, {"tags": ["variation", "period"], "text": "更换节奏：一次训练内不变、一个微周期内可微调、一个中周期（meso）结束后换动作是常见做法；频繁更换反而无法衡量渐进。"}, {"tags": ["mechanics"], "text": "多样性的来源包括动作、负荷区间、次数区间、组间安排与器械角度；保留 1–2 个可长期渐进的“锚定动作”便于追踪。"}], "limit": ""},{"id": "hyp-c06", "book": "hypertrophy", "title": "第6章 · 阶段强化", "pages": "168–184", "scope": "阶段顺序、积累—强化—峰减结构", "points": [{"tags": ["period"], "text": "增肌训练按积累（加量）→ 强化（提强度）→ 峰减/降负荷的结构推进，每个中周期结束安排降负荷周承接疲劳。"}, {"tags": ["period", "adaptation"], "text": "阶段顺序要让前一阶段为后一阶段服务：容量积累期建立的工作能力，支撑随后更高强度的强化期。"}, {"tags": ["fatigue"], "text": "每个中周期内容量从 MEV 渐进推向 MRV，触及 MRV 或表现停滞即进入降负荷，而不是硬扛。"}], "limit": ""},{"id": "hyp-c07", "book": "hypertrophy", "title": "第7章 · 个性化", "pages": "185–210", "scope": "个体差异来源、自评估与方案调整", "points": [{"tags": ["assessment"], "text": "个性化变量包括恢复能力、肌群敏感度、作息压力与训练经验；同一套数字在不同人身上 SFR 差异很大。"}, {"tags": ["autoreg", "recovery"], "text": "调整依据是可观察指标：泵感与目标肌群募集质量（RSM 输入）、酸痛与表现（疲劳侧输出）；据此增减组数与频率。"}, {"tags": ["dose"], "text": "书中给出的 MEV/MRV 数值区间是起点参照，个人需用 1–2 个中周期实测出自己的区间。"}], "limit": ""},{"id": "hyp-c08", "book": "hypertrophy", "title": "第8章 · 综述与特殊情况", "pages": "211 起", "scope": "七原则整合、特殊人群与场景应用", "points": [{"tags": ["goal", "period"], "text": "完整增肌计划 = 特异性定方向 → 超负荷与有效刺激范围定剂量 → 疲劳管理与 SRA 定节奏 → 多样化与阶段强化定结构 → 个性化做修正。"}, {"tags": ["nutrition", "recovery"], "text": "特殊情况（减脂期、压力大的生活周期）下优先下调容量至 MEV 附近，保住恢复余量比维持训练量更重要。"}, {"tags": ["assessment"], "text": "把本书框架当作评估工具：对照任何增肌计划，先找最先被违反的原则，而不是先加新技术。"}], "limit": ""}, {"id": "principles-c01", "book": "principles", "title": "第1章 · 重要术语", "pages": "11–15", "scope": "强度、相对强度、容量、频率及周期单位", "points": [{"tags": ["dose", "intensity"], "text": "绝对负重、相对最大重量的比例和接近力竭的程度回答不同问题；先对齐术语，才能比较两份计划。"}, {"tags": ["dose"], "text": "容量可以指机械功，也可用组次、总重复或吨位近似。近似指标方便追踪，却不能把不同动作、幅度和负重区间的刺激等量化。"}, {"tags": ["period"], "text": "单次训练、周与更长周期是不同组织尺度；同一周的负荷变化不等于长期阶段目标已改变。"}], "limit": ""}, {"id": "principles-c02", "book": "principles", "title": "第2章 · 训练原理简介", "pages": "16–19", "scope": "七条原理的层级与应用顺序", "points": [{"tags": ["goal"], "text": "作者将原理按优先级排列，先问训练是否服务于目标，再讨论细部安排；复杂计划不自动优于简单计划。"}, {"tags": ["adaptation", "fatigue"], "text": "超负荷需要疲劳管理和恢复承接；单独最大化某个变量可能破坏整体效果。"}, {"tags": ["assessment"], "text": "审查计划应寻找最先被违反的关键原理，而不是看到停滞就增加新技术。"}], "limit": ""}, {"id": "principles-c03", "book": "principles", "title": "第3章 · 原理1：专项性", "pages": "20–47", "scope": "适应方向、迁移、干扰、定向适应", "points": [{"tags": ["goal", "skill"], "text": "力量具有动作和任务特异性。增肌、动作技术和单次极限表现有关联，但不是同一个训练目标。"}, {"tags": ["variation", "accessory"], "text": "辅助动作的价值在于补足目标所需的能力；动作外观相似或训练很累，都不能单独证明迁移有效。"}, {"tags": ["period", "gpp"], "text": "同时追求多项能力会占用恢复资源；越接近重要表现日期，越需要明确主次。"}, {"tags": ["assessment"], "text": "用目标动作的技术质量、可重复表现和阶段结果检查迁移，而不是只看辅助动作纪录。"}], "limit": ""}, {"id": "principles-c04", "book": "principles", "title": "第4章 · 原理2：超负荷", "pages": "48–68", "scope": "刺激门槛、过载方式、可恢复容量", "points": [{"tags": ["adaptation", "dose"], "text": "训练要对当前能力提出足够要求，才有继续适应的理由；原来有效的剂量不保证长期仍然有效。"}, {"tags": ["dose", "intensity"], "text": "增加负重、有效容量或任务难度都可能构成过载，不能把过载简化为每次必须加重量。"}, {"tags": ["dose", "fatigue"], "text": "最大可恢复容量是受条件影响的边界概念；逼近边界的收益必须与疲劳成本一起考虑。"}, {"tags": ["assessment"], "text": "先确认动作、计量口径和执行一致，再判断是否需要增加刺激，否则所谓进步可能只是标准放宽。"}], "limit": ""}, {"id": "principles-c05", "book": "principles", "title": "第5章 · 原理3：疲劳管理", "pages": "69–115", "scope": "能量、神经、化学信使、组织结构；减载与恢复", "points": [{"tags": ["fatigue"], "text": "作者把疲劳来源分为能量储备、神经系统、化学信使与组织结构，强调不同负担不一定同步恢复。"}, {"tags": ["fatigue", "assessment"], "text": "短期表现下降、累积疲劳与长期适应不足需要区别；不能把一次状态差直接解释为过度训练。"}, {"tags": ["period", "fatigue"], "text": "通过轻训练、减载或低压力阶段降低残留疲劳，让已经建立的能力得以表现。"}, {"tags": ["recovery", "nutrition"], "text": "恢复不仅取决于训练间隔，也受饮食、睡眠与生活压力影响；训练安排应适应现实恢复资源。"}, {"tags": ["dose"], "text": "工作能力和恢复能力相关但不相同：能完成更多训练，不代表增加后的负荷一定可持续。"}], "limit": ""}, {"id": "principles-c06", "book": "principles", "title": "第6章 · 原理4：刺激—恢复—适应", "pages": "116–150", "scope": "SRA、频率、不同能力的恢复节奏", "points": [{"tags": ["adaptation"], "text": "SRA用于描述训练后表现受疲劳压低、逐渐恢复并产生适应的过程；它是组织训练的模型，不是个人精确倒计时。"}, {"tags": ["frequency", "skill"], "text": "技术练习、肌肉刺激与高负荷表现的恢复节奏不同，因此可以区分技术接触和高压力训练。"}, {"tags": ["frequency", "dose"], "text": "频率过低可能减少有效练习，过高则可能让负担叠加；频率要与单次容量一起决定。"}, {"tags": ["assessment"], "text": "用多次训练的表现和恢复记录修正间隔，而不是用统一的小时数套所有动作。"}], "limit": ""}, {"id": "principles-c07", "book": "principles", "title": "第7章 · 原理5：变式", "pages": "151–170", "scope": "适应抵抗、变量变化、专项性代价", "points": [{"tags": ["variation"], "text": "变式包括动作、容量、强度、次数、频率与速度的有计划变化，不只是换练习。"}, {"tags": ["variation", "adaptation"], "text": "持续重复刺激可能遇到适应抵抗；改变某个变量是为了恢复训练效果，而不是追求新鲜感本身。"}, {"tags": ["variation", "skill"], "text": "过多变化会中断动作学习和结果比较。需要足够长的稳定窗口，才能知道某种方法有没有帮助。"}, {"tags": ["period"], "text": "距离比赛越近，变化通常越应服从比赛动作与表现要求。"}], "limit": ""}, {"id": "principles-c08", "book": "principles", "title": "第8章 · 原理6：阶段增益", "pages": "171–188", "scope": "增肌、力量、专项表现；适应保持与衰退", "points": [{"tags": ["period"], "text": "前一阶段为后一阶段提供条件：增加可用肌肉和工作能力，再提高力量表达与比赛专项性。"}, {"tags": ["period", "dose"], "text": "阶段转换会改变训练量、强度、动作选择和主次关系，不是只给相同计划换名称。"}, {"tags": ["adaptation", "period"], "text": "集中发展一个目标时，其他能力仍需适量维持，避免刚建立的基础在后续阶段过快丢失。"}, {"tags": ["competition", "fatigue"], "text": "赛前阶段既要维持必要刺激，也要消除妨碍表现的疲劳；提前或延后达到状态都偏离目的。"}], "limit": ""}, {"id": "principles-c09", "book": "principles", "title": "第9章 · 原理7：个体差异", "pages": "189–205", "scope": "体型、经验、能力、恢复环境与个人反应", "points": [{"tags": ["assessment"], "text": "同样训练对不同体型、水平、经验与生活条件的人会产生不同刺激和成本。"}, {"tags": ["dose", "frequency"], "text": "容量和频率不是身份标签决定的固定数值，而应由历史反应和当下条件调整。"}, {"tags": ["variation", "mechanics"], "text": "动作选择需要考虑身体比例、现有弱点、可用器械和执行能力。"}, {"tags": ["assessment"], "text": "个体化需要记录形成证据，不等于随心所欲；同一人换阶段或生活环境，也需要重新评估。"}], "limit": ""}, {"id": "principles-c10", "book": "principles", "title": "第10章 · 力量举周期", "pages": "206–211", "scope": "把七条原则组成训练周期", "points": [{"tags": ["period"], "text": "周期化的作用是组织多个目标及其时间关系，让训练符合比赛或测试安排。"}, {"tags": ["goal", "period"], "text": "先定最终表现任务，再安排基础能力与专项能力的建设顺序。"}, {"tags": ["fatigue", "autoreg"], "text": "计划给出方向，反馈帮助修订剂量与节奏；遵守原则比追随某种周期名称更重要。"}], "limit": ""}, {"id": "principles-c11", "book": "principles", "title": "第11章 · 力量举的谜思、谬论与潮流", "pages": "212–228", "scope": "无装备与有装备、超高频、有氧、活动度、体重级别、随意训练", "points": [{"tags": ["competition", "accessory"], "text": "无装备与有装备的限制环节不一定相同，不能直接复制另一类运动员的锁定训练和超负荷手段。"}, {"tags": ["frequency", "assessment"], "text": "高频案例不能单独证明频率造成成功，筛选、训练历史和总量都可能参与结果。"}, {"tags": ["gpp", "fatigue"], "text": "有氧与其他运动可支持体能，也可能争夺恢复资源；是否加入取决于总负担与当前目标。"}, {"tags": ["mechanics", "goal"], "text": "活动度应支持所需动作，而不是无限追求柔韧；体重级别的选择也要服务长期发展。"}, {"tags": ["assessment"], "text": "反对随机训练和对名人模板的迷信，主张用原理审查计划质量。"}], "limit": "本章具有作者论战立场；涉及体重、健康与极端频率的描述不自动转成个人处方。"}, {"id": "ss-c01", "book": "ss", "title": "第1章 · 力", "pages": "8–13", "scope": "力量、杠铃与可量化训练", "points": [{"tags": ["goal"], "text": "作者将基础力量视为许多身体任务的重要能力，主张用可逐步加负重的杠铃动作发
