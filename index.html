const bridges={systems:'先明确任务、条件与计量口径，再比较体系的组织逻辑。',books:'逐份核对资料贡献与引用位置。',logic:'先理解力量与适应，再学会选择动作、组织剂量和安排阶段。',squat:'从平衡与支撑出发，沿下降、底部、起身找到重点，最后检验卡点假设。',bench:'从稳定支撑出发，连起触点、轨迹与腿驱，再分析离胸、中段和锁定。',deadlift:'先选风格与设置，再处理起拉、过膝和锁定，最后检查疲劳成本。',diagnosis:'先确认停滞，再建立证据链、选择小实验，用连续记录决定下一步。',recovery:'从总能量和食物结构出发，把营养与生活恢复放回训练负担中评价。',injury:'先识别就医信号，再记录症状与功能，最后讨论任务调整与回归。'};

function deepHTML(a){return `<section class="deepstudy"><div class="deephead">深度研读 <span>从原理到训练判断</span></div>${(a.deep||[]).map(s=>`<section class="deepunit"><h3>${esc(s.title)} <small>${esc(s.kind)}</small></h3><p>${esc(s.text)}</p><div class="inline-source">${esc(s.kind)}依据：${esc(s.ref)}${s.kind.includes('示例')?'；示例由本库编写，不是原书训练处方。':''}</div></section>`).join('')}</section>`}


function booksView(){return intro('逐书内容索引','不是只列书名：每份资料都有内容结构、代表观点、正文归属与使用边界。','SOURCE COVERAGE / 17 份独立资料')+`<div class="message">页码一律指上传 PDF 的物理页。当前资料包含训练教材、手册、指南与配套说明；“17份”不等于17本互不相关的大部头。重复手册不重复计数。以下为主干归纳，细节请对照原文件。</div><div class="bookjump">${BOOKS.map((b,i)=>`<a href="#book-${b.id}">${String(i+1).padStart(2,'0')} ${esc(b.name)}</a>`).join('')}</div><div class="chapterbook">${BOOKS.map((b,i)=>`<section class="bookrecord" id="book-${b.id}"><span class="eyebrow">SOURCE ${String(i+1).padStart(2,'0')}</span><h2>${esc(b.name)}</h2><p class="bookauthor">${esc(b.author)}</p><dl><dt>全书主干</dt><dd>${esc(b.structure)}</dd><dt>代表观点</dt><dd>${esc(b.claims)}</dd><dt>如何进入知识库</dt><dd>${esc(b.application)}</dd><dt>边界与分歧</dt><dd>${esc(b.limits)}</dd><dt>核对位置</dt><dd>${esc(b.refs)}</dd></dl><div class="articleactions">${b.related.map(id=>{const a=KB.find(x=>x.id===id);return `<button class="smallbtn" data-article="${id}">${esc(a.title)} →</button>`}).join('')}</div></section>`).join('')}</div>`}
function comparisonTable(){const rows=[['Starting Strength / PP','基础动作与简单进阶','从每次任务到周内分工','技术、执行与恢复','能继续从简单结构受益'],['得州 / 斯塔尔等','周内负荷角色区分','容量与强度任务互相支持','相对轻日及实际周负担','每次都难已不易恢复'],['舍伊科','竞技技术与负荷分配','单次到小、中、大周期','外在负荷与内在反应','需要系统技能与负荷记录'],['JTS','评估后确定阶段与剂量','增肌、增力、冲刺及桥接','容量阈值、频率、减载','需要长期设计与个体化'],['早期 RTS','目标模块与反馈','RPE、反应修订、疲劳规则','初始表现、时限与停止条件','能稳定记录并解释指标'],['Westside 共轭','不同努力方法与变式','最大、动态、重复努力并行','任务分工与个体辅助','需理解器械、风格及阻力'],['PTW / PNP / PIP','按组织需求分类','逐步加入变化与自调节','轻日、反馈及训练能力','不能只凭年限或成绩分级'],['SBS 旅程及说明','按发展重点组织学习','技能、肌肉、专项工作能力','示例任务与进阶时间尺度','需结合配套说明理解']];return `<div class="toolbox"><h2>体系对照：先对齐问题，再选工具</h2><div class="flowwrap"><table class="flowtable"><thead><tr><th>方法</th><th>主要假设</th><th>组织方式</th><th>疲劳如何考虑</th><th>关键前提</th></tr></thead><tbody>${rows.map(r=>'<tr>'+r.map(c=>'<td>'+esc(c)+'</td>').join('')+'</tr>').join('')}</tbody></table></div><p class="savednote">此表是跨书综合，不是效果排名。具体出处和限制见下方各专题。动作、总量和努力程度定义不同，不能横向只比百分比。</p></div>`}

function categoryView(id){const c=category(id),lift=['squat','bench','deadlift'].includes(id);let arr=KB.filter(a=>a.cat===id);if(id==='diagnosis')arr=[...arr,...KB.filter(a=>a.cat==='practice')];return (id==='books'?booksView():id==='systems'?intro('训练体系与计划组织','每一种方法按基本假设、训练组织、进阶与疲劳控制、适用边界展开。')+comparisonTable()+`<div class="chaptertoc"><b>体系阅读顺序</b>${arr.map(a=>`<button data-article="${a.id}">${esc(a.title)}</button>`).join('')}</div><div class="chapterbook">${arr.map(a=>article(a,true)).join('')}</div>`:intro(lift?'三大项动作框架':c[2],bridges[id]||c[3],lift?'动作技术 / 重难点 / 弱点突破':'知识主线 / '+c[2])+(lift?`<div class="lifttabs">${[['squat','深蹲'],['bench','卧推'],['deadlift','硬拉']].map(([k,t])=>`<button data-go="${k}" class="${k===id?'on':''}">${t}</button>`).join('')}</div>`:'')+(id==='injury'?'<div class="message alert">先看就医信号。训练调整不能代替伤情评估。</div>':'')+`<div class="chaptertoc"><b>本章阅读顺序</b>${arr.map((a,i)=>`<button data-article="${a.id}"><span>${String(i+1).padStart(2,'0')}</span>${esc(a.title.split(' · ').slice(1).join(' · ')||a.title)}</button>`).join('')}</div><div class="chapterbook">${arr.map(a=>article(a,true)).join('')}</div><div class="chapterend"><b>把本章放回训练全局</b><p>${id==='recovery'?'结合完成质量与表现趋势，检验恢复是否匹配训练。':id==='injury'?'在适合恢复训练时，逐步重新建立任务耐受。':'动作、剂量和恢复需要一起解释。用同标准下的表现检验调整。'}</p><button class="smallbtn" data-go="${id==='logic'?'squat':lift?'diagnosis':id==='diagnosis'?'recovery':'home'}">${id==='logic'?'下一步：三大项动作框架':lift?'下一步：弱点诊断与突破':id==='diagnosis'?'下一步：营养及恢复':'回到知识总览'} →</button></div>`)}
function moreView(){return intro('阅读工具','收藏与笔记保留在当前浏览器。')+`<div class="morelist"><button data-go="saved">我的收藏 <span>→</span></button><button data-path="learn">系统学习路线 <span>→</span></button><button data-go="clinic">卡点排查台 <span>→</span></button><button data-go="books">逐书内容索引 <span>→</span></button><button data-go="sources">阅读说明与来源 <span>→</span></button></div>`}
const routes={learn:['strength','adapt','dose','sq-model','bp-model','dl-model','evidence','energy','life','weekly']};
function pathView(name){return intro('一条从理解到行动的路线','按顺序阅读，也可以从与你当前问题最相关的一篇开始。','READING PATH / 系统学习')+`<div class="articlelist">${routes[name].map(id=>article(KB.find(a=>a.id===id))).join('')}</div>`}
const scenarios={squat:[['臀先起 / 前倾','sq-hiprise','先看下降和底部是否已失衡，再比较轻重负荷。','如果轻负荷稳定、末次才变化，先管理难度和疲劳；若总在同阶段失位，再测试控制与能力假设。'],['底部起不来','sq-break','确认深度、支撑和底部张力是否一致。','稳定工作组与一次极限失败分开看。暂停用于测试底部控制，不能直接证明臀腿某块肌肉弱。'],['膝部 / 骨盆变化','sq-knee','观察变化幅度、负荷依赖与是否伴随不适。','只凭视频不能确认损伤。先看可控性与功能，不强行追求统一姿势。']],bench:[['离胸困难','bp-chest','先检查出杠、上背、触点与暂停后的张力。','同标准的暂停练习用于测试底部控制，再决定是否需要更多能力建设。'],['中段卡住','bp-lock','回看卡住之前的轨迹，是否先直上再突然向后。','中段是正常困难区之一，位置稳定后才测试专项能力假设。'],['锁定失败','bp-lock','看肘部运动与杠铃是否已回到有利位置。','不要直接把问题全部归因于三头；半程进步需要由完整卧推检验。']],deadlift:[['离地慢 / 髋先起','dl-floor','先区分传统与相扑，再看实际起拉位置。','相扑地面困难可能正常。用保守负荷重复设置，而非一味把髋压低。'],['膝附近卡住','dl-knee','检查前段髋位、杠是否绕膝及重心前移。','先修复前段到过膝的连接，再考虑增加分段能力。'],['锁定困难','dl-lock','先看是否重心偏前、站距过宽或杠离身体远。','先形成可完成的站直位置，再用辅助实验验证顶端能力。']]};let selectedLift='squat',selectedCase=0;
function clinic(){return intro('卡点排查台','选择项目和现象，得到检查顺序与验证方法。这里不自动判定弱肌或损伤。','OBSERVE → TEST → VERIFY')+`<div class="toolbox"><h2>你在哪个环节遇到困难？</h2><div class="choices">${[['squat','深蹲'],['bench','卧推'],['deadlift','硬拉']].map(([id,t])=>`<button class="choice ${selectedLift===id?'on':''}" data-lift="${id}" aria-pressed="${selectedLift===id}">${t}</button>`).join('')}</div><div class="choices">${scenarios[selectedLift].map((s,i)=>`<button class="choice ${selectedCase===i?'on':''}" data-case="${i}" aria-pressed="${selectedCase===i}">${s[0]}</button>`).join('')}</div><div class="toolresult"><span class="pill">训练假设，不是确诊</span><h3>${scenarios[selectedLift][selectedCase][0]}</h3><p><b>第一步 · </b>${scenarios[selectedLift][selectedCase][2]}</p><p><b>第二步 · </b>${scenarios[selectedLift][selectedCase][3]}</p><p><b>第三步 · </b>固定动作标准与观察角度，一次试一个改变，回到原主项复测。若出现疼痛或功能异常，先走伤病排查流程。</p><button class="smallbtn" data-article="${scenarios[selectedLift][selectedCase][1]}">阅读完整分析 →</button> <button class="smallbtn" data-article="evidence">学习证据链 →</button></div></div><div class="toolbox"><h2>排查时，把证据排成顺序</h2><div class="flowwrap"><table class="flowtable"><thead><tr><th>先问</th><th>提示</th><th>下一步</th></tr></thead><tbody><tr><td>标准一致吗？</td><td>幅度、停顿、器械、次数</td><td>先恢复可比条件</td></tr><tr><td>从哪一刻开始变化？</td><td>不只看失败的一帧</td><td>回溯设置和前一阶段</td></tr><tr><td>轻重、首尾有差别吗？</td><td>技术、负荷与疲劳共同参与</td><td>在可控条件复测</td></tr><tr><td>调整后主项改善吗？</td><td>变式成绩不等于主项迁移</td><td>保留有效工具或重审假设</td></tr></tbody></table></div></div>`}
function sources(){return `<div class="toolbox"><h2>引用与阅读说明</h2><p>同一主题可以汇总不同作者，但每段保留其书名、PDF物理页码与归纳性质。作者经验不升级为个体诊断阈值；OCR不清的训练表不重建精确数字。</p><p>临床分流仍参考 NHS / NICE，训练书不能替代临床诊断。参考链接见伤病条目。配图及之前截取的动作图片已全部移除。</p><p>收藏、已读和笔记保存在本机浏览器。旧有主题的标识保留，方便原有笔记继续对应。</p><button class="smallbtn" id="exportNotes">导出笔记备份</button><p id="exportStatus" class="savednote" role="status"></p></div>`}
function render(){navRender();if(current==='home'){view.innerHTML=home()}else if(current==='more')view.innerHTML=moreView();else if(category(current))view.innerHTML=categoryView(current);else if(current==='clinic')view.innerHTML=clinic();else if(current==='learn')view.innerHTML=pathView('learn');else if(current==='sources')view.innerHTML=booksView()+sources();else if(current==='saved'){const arr=KB.filter(a=>saved.includes(a.id));view.innerHTML=intro('我的收藏','把与你当前训练最相关的知识保留在这里。','PERSONAL INDEX / 本机收藏')+(arr.length?'<div class="articlelist">'+arr.map(a=>article(a)).join(''):'<div class="empty">还没有收藏。打开任意知识条目，点击“收藏条目”。</div>')}document.getElementById('crumb').textContent='FIELD GUIDE / '+(category(current)?.[2]||({home:'总览',clinic:'卡点排查',learn:'学习路线',sources:'引用说明',books:'逐书内容',systems:'训练体系',saved:'我的收藏'}[current]||'知识库'))}
function go(id){clearTimeout(timer);history.replaceState(null,'',location.pathname+location.search);if(!category(id)&&!['home','clinic','learn','sources','saved','more'].includes(id))id='home';current=id;document.getElementById('search').value='';render();window.scrollTo({top:0,behavior:'instant'})}
function openArticle(id){const a=KB.find(a=>a.id===id);if(!a)return;go(a.cat);const e=document.getElementById('a-'+id);e.open=true;e.scrollIntoView({behavior:'smooth',block:'start'});history.replaceState(null,'','#'+id)}
function search(q){q=q.trim();if(!q){render();return}const terms=q.toLowerCase().split(/\s+/).filter(Boolean);const scored=KB.map(a=>({a,score:terms.reduce((s,t)=>s+(a.title.toLowerCase().includes(t)?8:0)+([a.lead,a.why,a.observe,a.act,a.check,a.tags,...(a.deep||[]).map(s=>s.text)].join(' ').toLowerCase().includes(t)?1:0),0)})).filter(x=>x.score>0).sort((a,b)=>b.score-a.score);view.innerHTML=intro('搜索结果',`“${esc(q)}” · ${scored.length} 篇相关条目`,'SEARCH / 全文检索')+(scored.length?'<div class="articlelist">'+scored.map(x=>article(x.a)).join(''):'<div class="empty">没有匹配条目。可试试“臀先起”“触点”“离地”“RPE”或“疲劳”。</div>');document.getElementById('crumb').textContent='FIELD GUIDE / 搜索'}
function toggleArray(kind,id,button){const arr=kind==='saved'?saved:done;const at=arr.indexOf(id);at<0?arr.push(id):arr.splice(at,1);const ok=write(kind,arr);button.classList.toggle('on',arr.includes(id));button.textContent=kind==='saved'?(arr.includes(id)?'已收藏':'收藏条目'):(arr.includes(id)?'已读 ✓':'标为已读');if(!ok)button.textContent+=' · 本次会话';const head=document.querySelector('#a-'+id+' summary b');if(kind==='done'&&head){const a=KB.find(a=>a.id===id);head.innerHTML=(done.includes(id)?'<span class="readstatus" aria-label="已读"></span>':'')+esc(a.title)}}
function printArticle(id){const a=KB.find(a=>a.id===id);if(!a)return;const w=window.open('','_blank');if(!w){alert('请允许打印窗口，或使用浏览器打印当前页。');return}w.document.write('<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>'+esc(a.title)+'</title><style>body{font:15px/1.9 sans-serif;max-width:780px;margin:35px auto;padding:0 25px}h1{font-size:25px}h2{font-size:15px;color:#29483c}small{color:#666}</style><h1>'+esc(a.title)+'</h1><p>'+esc(a.lead)+'</p>'+[['为什么','why'],['先观察','observe'],['怎么做','act'],['如何验证','check']].map(([t,k])=>'<h2>'+t+'</h2><p>'+esc(a[k])+'</p>').join('')+(a.deep||[]).map(s=>'<h2>'+esc(s.title)+'</h2><p>'+esc(s.text)+'</p><small>依据：'+esc(s.ref)+'；'+esc(s.kind)+'</small>').join('')+(notes[id]?'<h2>我的笔记</h2><p style="white-space:pre-wrap">'+esc(notes[id])+'</p>':'')+'<small>参考：'+esc(a.ref)+'</small></html>');w.document.close();w.focus();setTimeout(()=>w.print(),250)}
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.go)go(b.dataset.go);else if(b.dataset.path)go('learn');else if(b.dataset.article)openArticle(b.dataset.article);else if(b.dataset.save)toggleArray('saved',b.dataset.save,b);else if(b.dataset.read)toggleArray('done',b.dataset.read,b);else if(b.dataset.notetoggle){let box=document.getElementById('note-'+b.dataset.notetoggle);box.hidden=!box.hidden;b.setAttribute('aria-expanded',!box.hidden);if(!box.hidden)box.querySelector('textarea').focus()}else if(b.dataset.print)printArticle(b.dataset.print);else if(b.dataset.lift){selectedLift=b.dataset.lift;selectedCase=0;view.innerHTML=clinic()}else if(b.dataset.case!==undefined){selectedCase=Number(b.dataset.case);view.innerHTML=clinic()}else if(b.id==='exportNotes'){const blob=new Blob([JSON.stringify({format:'strength-field-notes-v1',saved,done,notes},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='strength-field-notes.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);document.getElementById('exportStatus').textContent='已生成笔记备份下载。'}});
document.addEventListener('input',e=>{const id=e.target.dataset.note;if(!id)return;notes[id]=e.target.value;const ok=write('notes',notes);document.querySelector(`[data-notestatus="${id}"]`).textContent=ok?'已保存在当前浏览器':'无法持久保存，请复制笔记备份。'});
let timer;document.getElementById('search').addEventListener('input',e=>{clearTimeout(timer);let q=e.target.value;timer=setTimeout(()=>search(q),150)});document.getElementById('searchForm').addEventListener('submit',e=>{e.preventDefault();clearTimeout(timer);search(document.getElementById('search').value)});document.getElementById('clearSearch').onclick=()=>{clearTimeout(timer);document.getElementById('search').value='';render()};render();const initial=location.hash.slice(1);if(KB.some(a=>a.id===initial))openArticle(initial);

</script></body></html>
