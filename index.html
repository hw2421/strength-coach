</style><style>.inline-source{display:block;font-size:10px;line-height:1.8;color:#a7b9cf;border-left:2px solid #526d88;padding:5px 9px;margin-top:9px}.deepstudy{margin-top:24px;border-top:1px solid var(--line);padding-top:17px}.deephead{font-size:14px;color:var(--forest);font-weight:700}.deephead span{display:block;font-size:10px;color:var(--muted);font-weight:400}.deepunit{margin:19px 0}.deepunit h3{font-size:14px;color:var(--rust);margin:0 0 7px}.deepunit h3 small{display:block;font-size:10px;color:var(--muted);font-weight:400;margin-top:2px}.deepunit p{font-size:14px;line-height:2;color:#dce5f0;margin:0}.chapterbook .article+.article{border-top:3px solid var(--line)}@media print{.deepunit p{color:black}.inline-source{color:#555}}</style></head><body><div class="layout"><header><div class="brand"><span class="brandmark">Ⅱ</span><div><div class="brandname">力的秩序</div><div class="brandsub">力量训练知识库 / TRAIN WITH UNDERSTANDING</div></div></div></header><main><div class="topbar"><div class="breadcrumb" id="crumb">知识总览</div><form class="search" id="searchForm" role="search"><span>⌕</span><input id="search" aria-label="搜索知识库" placeholder="搜索：臀先起、触点、卡点、疲劳…"><button type="button" id="clearSearch" aria-label="清除搜索">×</button></form></div><div id="view"></div><footer class="footer"><span>理解原理 · 稳定动作 · 观察反馈 · 持续调整</span><span>训练知识用于学习与决策；症状评估不代替临床检查。</span></footer></main></div><nav class="nav" id="nav" aria-label="主导航"></nav><script>
const KB=[{"cat": "logic", "id": "strength", "title": "01 · 力量不是单一能力", "lead": "把“变强”拆成肌肉提供潜力、技能组织发力，以及在目标动作中表达能力。", "why": "相同肌肉量的人，动作经验、身体比例和发力策略可以不同。同一个人也可能因疲劳或动作标准变化而表现不同。长期能力与当天成绩要分开理解。", "observe": "记录动作、幅度、停顿、重量、次数和主观努力。一次最大重量只是一种表达，不代表全部训练成果。", "act": "先选阶段目标：学动作、积累肌肉和工作能力，或提高专项大重量表现。用相应指标评价，避免每次训练都以破纪录为标准。", "check": "同标准下重量或次数提高、同任务努力下降、重复一致性提高，都可作为进步证据。", "ref": "SBS《旅程》p.24–25、41、46；《力量训练原理》p.18–20", "tags": "能力 技能 肌肉 神经", "deep": [{"title": "深入理解", "text": "肌肉能产生的力、关节力矩和杠铃上的表现并不是同一层面的量。肌肉的拉力通过内部力臂产生关节力矩，再与杠铃及身体各部分形成的外部力矩相抗衡。因此，增加肌肉潜力、改善位置和熟练地组织动作，都可能提高成绩，但各自需要不同的训练投入。", "kind": "资料归纳", "ref": "SBS《旅程》p.24–25、41、46；《力量训练原理》p.18–20"}, {"title": "操作流程", "text": "先把目标写成可观察任务，例如固定停顿卧推的工作组表现。再分层记录：动作是否稳定、工作组能力是否提高、接近极限时能否表达。技术变化很大时优先处理动作；技术稳定而长期能力不变时，再检查肌肉与训练能力的积累。", "kind": "综合应用", "ref": "SBS《旅程》p.24–25、41、46；《力量训练原理》p.18–20"}, {"title": "误区与边界", "text": "不能根据体重或训练年限断言一个人只缺肌肉或只缺神经适应。熟练度可以在某一个项目较高、另一个项目较低。不同动作、不同幅度的个人纪录，也不能合并为同一条力量增长曲线。", "kind": "辨析与限制", "ref": "SBS《旅程》p.24–25、41、46；《力量训练原理》p.18–20"}, {"title": "情境示例", "text": "同样完成 100 kg 卧推五次，第一次没有停顿，第二次每次都保持一致暂停；这不能直接计算“力量增长了多少”，但可以明确暂停任务完成得更好了。下一轮应固定这一标准再比较。", "kind": "教学示例，非个体处方", "ref": "SBS《旅程》p.24–25、41、46；《力量训练原理》p.18–20"}]}, {"cat": "logic", "id": "adapt", "title": "02 · 刺激有收益，也有成本", "lead": "有效训练是可恢复、可重复、能逐步推进的刺激。", "why": "专项性决定刺激的方向；超负荷决定是否足以推动进一步适应。更难不自动更有效，短期疲劳也不等于长期收益。", "observe": "看实际完成量、动作质量、后续表现与恢复条件，不用出汗、酸痛或练后瘫倒衡量刺激是否合格。", "act": "先维持一个能稳定执行的基线，再小幅推进一个变量。把训练后的恢复条件纳入安排，而不是练坏后才补救。", "check": "在多次可比训练中，完成质量和进步趋势是否改善？若训练越来越难却没有更多收益，重新检查剂量。", "ref": "《力量训练原理》p.18–20；《计划致胜》p.14、20", "tags": "超负荷 疲劳 适应", "deep": [{"title": "深入理解", "text": "《力量训练原理》把超负荷理解为足以引起适应、同时仍处在可接受范围内的刺激，并强调阶段平均刺激的推进，而非每次训练都超过上次。训练引起的疲劳可能暂时压低表现，因此“今天更难”与“刺激更好”之间不存在必然等号。", "kind": "资料归纳", "ref": "《力量训练原理》PDF p.48–51（超负荷与容量范围）"}, {"title": "操作流程", "text": "建立能连续完成的训练基线；记录每次的负荷、组次、动作质量和恢复。只有在完成稳定时推进主要变量。观察推进后不只是当日完成了多少，还包括接下来几次训练的可完成性。若后续持续受损，先检查新增刺激的成本。", "kind": "综合应用", "ref": "《力量训练原理》PDF p.48–51（超负荷与容量范围）"}, {"title": "误区与边界", "text": "过载不等于每次加重量，也不等于必须做到失败。轻量技术训练和减载可能不负责制造主要过载，却能支持整个阶段的执行。相反，短期少量进步也不能证明目前训练量已是最佳。", "kind": "辨析与限制", "ref": "《力量训练原理》PDF p.48–51（超负荷与容量范围）"}, {"title": "情境示例", "text": "一周多加两组后，当日勉强完成，但下一次同项工作组明显下降。先把这次变化当成剂量试验的反馈，而不是把下降解释成必须更拼。应检查新增组的难度及其对后续训练的影响。", "kind": "教学示例，非个体处方", "ref": "《力量训练原理》PDF p.48–51（超负荷与容量范围）"}]}, {"cat": "logic", "id": "dose", "title": "03 · 剂量的四个旋钮", "lead": "组数、负荷、努力程度、频率分别回答不同问题。", "why": "容量描述做了多少；相对负荷描述重量相对最大能力多大；努力程度描述离极限多近；频率描述如何分配练习与负担。四者相互影响，不能互相替代。", "observe": "周总量与单次总量分开看。比较同动作、相近幅度和努力程度下的工作组，不把不同动作吨位简单相加。", "act": "动作质量差先降低单次难度或分散负担；恢复良好且长期刺激不足，再试加量或加重。加频率时先保持周量相近。", "check": "调整后记录完成质量与下一次表现。不要只看新增了多少组，要看多出来的训练是否能持续。", "ref": "《力量训练原理》p.12、18–20；《计划致胜》p.14", "tags": "强度 容量 频率 RIR", "deep": [{"title": "深入理解", "text": "同样是五组，五组低努力技术重复与五组接近失败的重复，其训练成本不同。频率首先改变的是负担分配和接触动作的机会；提高频率之后如果同时增加周总量，就不能把结果全部归因于“练得更频繁”。", "kind": "资料归纳", "ref": "《力量训练原理》p.12、18–20；《计划致胜》p.14"}, {"title": "操作流程", "text": "先列周总工作组，再列每次的组数和努力范围。比较首尾组质量，找出单次过于集中还是全周总体负担过高。测试分配作用时，先把相同周量分到更多训练单元，再观察质量；需要加量时，另立一次试验。", "kind": "综合应用", "ref": "《力量训练原理》p.12、18–20；《计划致胜》p.14"}, {"title": "误区与边界", "text": "吨位适合描述同一动作中工作量的变化，却不是跨动作的统一刺激单位。热身组、部分幅度组和常规工作组混在一起，会让组数看起来精确却失去可解释性。不同计数口径必须先标明。", "kind": "辨析与限制", "ref": "《力量训练原理》p.12、18–20；《计划致胜》p.14"}, {"title": "情境示例", "text": "原来每周一次做六组卧推，后半程触点经常漂移。可以先试把六组分两次完成，保持总量近似。若质量提高，只能说明分配可能更适合；不能据此认定每周十二组会更好。", "kind": "教学示例，非个体处方", "ref": "《力量训练原理》p.12、18–20；《计划致胜》p.14"}]}, {"cat": "logic", "id": "rpe", "title": "04 · RPE 是反馈语言，不是精密仪器", "lead": "用努力程度解释表现，但不要把一次主观评分换算成确定的最大重量。", "why": "RPE 的用途是帮助同一个人在相似任务中判断当天难度。上传的早期 RTS 把 10 描述为无余力、9 约剩一次、8 约剩 2–4 次；不同版本刻度不能默默混用。", "observe": "同时记重量、次数和评分；观察末次速度变化与技术，别只凭全身喘不喘评分。新动作与高次数组的估计往往更不稳定。", "act": "固定使用一套描述；保留关键组视频，与后续相同任务比较。自调节先从保守选重开始，不需要靠频繁力竭来“校准”。", "check": "同重量同次数的评分是否越来越一致？若评分和视频常矛盾，先改善记录与判断。", "ref": "《RTS 反应训练系统》p.15、56–57", "tags": "RPE 努力 留力", "deep": [{"title": "深入理解", "text": "上传的早期 RTS 刻度不是现代常见的逐级精确 RIR 对照表：p.15 把 RPE 8 描述为仍有约 2–4 次余力，RPE 9 约一次，RPE 10 无余力。p.56–57 的疲劳百分比还依赖相同次数、目标努力与总体时间限制，不能抽离这些条件单独套用。", "kind": "资料归纳", "ref": "《RTS 反应训练系统》p.15、56–57"}, {"title": "操作流程", "text": "每次评分同时写重量、次数、动作标准和主观剩余次数。用相似任务的后续表现校准，不必为了证明自己还能做几次而强行做到失败。若用疲劳百分比，先明确初始表现、停止规则和时限，否则只是在随意降重。", "kind": "综合应用", "ref": "《RTS 反应训练系统》p.15、56–57"}, {"title": "误区与边界", "text": "RPE 不是呼吸急促程度，也不是动作看起来慢就一定接近失败。不同人、不同动作、不同组次的主观误差不同；由一次评分推算出的最大重量只能作为估计，不应直接覆盖长期记录。", "kind": "辨析与限制", "ref": "《RTS 反应训练系统》p.15、56–57"}, {"title": "情境示例", "text": "教学计算：初始三次组在相同目标努力下使用 100 kg，若采用 5% 的负荷下降阈值，对应 95 kg。这里解释的是阈值如何计算，并不推荐把 5% 作为你的训练终止值，也不要求做到极限。", "kind": "教学示例，非个体处方", "ref": "《RTS 反应训练系统》p.15、56–57"}]}, {"cat": "logic", "id": "volume", "title": "05 · 有效量与可恢复量是动态范围", "lead": "MEV / MRV 用来提问，不是给所有人的组数处方。", "why": "最小有效量表示足以推动进步的训练量，可恢复上限表示当前条件下能消化的负担。两者随动作、阶段和生活条件变化，不能长期钉死。", "observe": "在固定计数组口径下，记录个人对训练量的反应。热身、比赛动作、变式和孤立动作的刺激不能无条件等价。", "act": "从已知可执行的训练量出发；有进步就不必追上限。增量后若多次完成质量与恢复变差，回看负荷、努力程度和生活条件。", "check": "判断标准是训练反应，不是是否达到书上的示例区间。一次疲劳或一次好成绩都不足以定位边界。", "ref": "JTS《力量举计划设计手册》p.16；《计划致胜》p.14", "tags": "MEV MRV 组数", "deep": [{"title": "深入理解", "text": "JTS 在增肌阶段给出的参数包括 55%–75% 1RM、每组 6–12 次，并列出深蹲 MEV 5–10 / MRV 10–16、卧推 6–12 / 14–20、硬拉 4–7 / 8–14 个超负荷组每周。这些数字属于该阶段和计组定义，不能改写成全年统一标准。", "kind": "资料归纳", "ref": "JTS《力量举计划设计手册》PDF p.16；《力量训练原理》PDF p.50–51、84–85"}, {"title": "操作流程", "text": "确定当前阶段与工作组口径后，先记录已经能恢复并取得进步的量。加量时同时观察组内质量、后续同项表现和其他项目受影响程度。出现持续恶化时，先核对强度和努力程度有没有同步提高，再决定是否回撤容量。", "kind": "综合应用", "ref": "JTS《力量举计划设计手册》PDF p.16；《力量训练原理》PDF p.50–51、84–85"}, {"title": "误区与边界", "text": "原书强调容量边界会随训练强度、生活条件与经验变化。MRV 也不是每天都要触及的目标，更不是以疼痛或失败为标志去寻找的“安全极限”。本库采用的保守试验步骤属于综合应用。", "kind": "辨析与限制", "ref": "JTS《力量举计划设计手册》PDF p.16；《力量训练原理》PDF p.50–51、84–85"}, {"title": "情境示例", "text": "如果十组卧推能稳定进步，而十二组使后两次训练完成质量持续下降，十组暂时可能更适合当前条件。这个结果不能推出“你的 MRV 永远就是十一组”，因为其他条件可能改变。", "kind": "教学示例，非个体处方", "ref": "JTS《力量举计划设计手册》PDF p.16；《力量训练原理》PDF p.50–51、84–85"}]}, {"cat": "logic", "id": "specific", "title": "06 · 动作选择是一笔投资", "lead": "比赛动作练表达，专项变式改要求，辅助训练建基础。", "why": "动作相似程度与疲劳成本都影响它的价值。动作不像比赛动作不等于无效，像比赛动作也不意味着必须保留。", "observe": "为每个动作写一句任务：练哪个技术环节、发展哪类能力、与主项如何互补。说不清任务时，先别继续堆动作。", "act": "一个问题选少量工具。保留主项练习机会，围绕明确假设加入变式或辅助；避免不断换动作导致记录不可比。", "check": "辅助或变式变强后，主项的对应表现是否改善？若只有辅助纪录上涨，检查迁移与机会成本。", "ref": "《力量训练原理》p.20、42；Juggernaut《诊断手册》p.12", "tags": "专项性 变式 辅助", "deep": [{"title": "深入理解", "text": "专项性既包含比赛动作的熟练表达，也包含支持该动作的肌肉与基础能力。JTS 的定向适应强调目标需要在一段连续时间内获得足够投入。每周轮换很多不相干目标，可能让每个目标都只得到不足的练习机会。", "kind": "资料归纳", "ref": "《力量训练原理》PDF p.20、42；JTS《力量举计划设计手册》PDF p.67"}, {"title": "操作流程", "text": "为每个动作建立任务卡：要改变的限制、改变的技术参数、预计疲劳成本、迁移指标。例如暂停深蹲改变底部停顿条件，胸托划船主要发展上背能力；两者不能用同一种“技术纠正”逻辑解释。", "kind": "综合应用", "ref": "《力量训练原理》PDF p.20、42；JTS《力量举计划设计手册》PDF p.67"}, {"title": "误区与边界", "text": "变式与主项相似并不保证收益；孤立动作与主项差别大也不等于没有价值。判断要同时看目标阶段、个人限制与可用恢复资源。不能用“专项性”作为删除所有辅助或保留所有比赛动作训练量的理由。", "kind": "辨析与限制", "ref": "《力量训练原理》PDF p.20、42；JTS《力量举计划设计手册》PDF p.67"}, {"title": "情境示例", "text": "若暂停深蹲进步而常规深蹲底部仍失位，可能需要更好地把控制转回常规动作，也可能原假设就不完整。此时继续追暂停纪录未必是最有价值的选择。", "kind": "教学示例，非个体处方", "ref": "《力量训练原理》PDF p.20、42；JTS《力量举计划设计手册》PDF p.67"}]}, {"cat": "logic", "id": "period", "title": "07 · 阶段安排是重点的轮换", "lead": "先建设，再强化，再表达；阶段之间需要过渡。", "why": "肌肉、专项工作能力和大重量表现的训练重点不同。可以同时维护多种能力，但不必同时追求所有维度最大增长。", "observe": "明确当前最主要目标及维持目标。比赛后或长期低次数训练后，原来的高次数工作量未必马上还能承受。", "act": "把新阶段的动作与训练量逐步引入。越接近表现目标，越重视可比的专项练习；结束峰值阶段后，用过渡训练恢复工作能力。", "check": "阶段结束时按该阶段目标评价，不用增肌阶段的一次最大重量直接否定全部效果。", "ref": "《力量训练原理》p.171；JTS《力量举计划设计手册》p.20、67", "tags": "周期 阶段 峰值", "deep": [{"title": "深入理解", "text": "阶段增益讨论的是前一阶段怎样支持下一阶段，而非把几个阶段名称按顺序排列。增肌与工作能力的积累能为较大负荷训练创造条件；较大负荷练习提高专项表达；减量则改变疲劳遮蔽程度。每一步服务的对象不同。", "kind": "资料归纳", "ref": "《力量训练原理》p.171；JTS《力量举计划设计手册》p.20、67"}, {"title": "操作流程", "text": "每个阶段写三项：主要发展指标、需要维护的能力、退出或转换条件。转换时不同时把动作、组次和强度全部推到新阶段最高值。经历峰值后，优先用过渡负担重建高次数训练能力。", "kind": "综合应用", "ref": "《力量训练原理》p.171；JTS《力量举计划设计手册》p.20、67"}, {"title": "误区与边界", "text": "高容量阶段的训练成绩不一定立刻表现为新的 1RM；赛前短期成绩提高也不等于肌肉在短时间大量增加。不同阶段应按不同目标评价，避免用一项指标否定其他能力的建设。", "kind": "辨析与限制", "ref": "《力量训练原理》p.171；JTS《力量举计划设计手册》p.20、67"}, {"title": "情境示例", "text": "经历数周低次数训练后，直接恢复过去最繁重的八次组可能导致工作能力不匹配。JTS p.20 用这一情境说明过渡周的价值；它不是说所有人都必须用固定一周、固定百分比。", "kind": "教学示例，非个体处方", "ref": "《力量训练原理》p.171；JTS《力量举计划设计手册》p.20、67"}]}, {"cat": "logic", "id": "systems", "title": "08 · 训练体系是工具箱", "lead": "先找到需要解决的问题，再决定使用哪种组织方式。", "why": "Rippetoe 强调适应节奏与复杂度；JTS 强调原则、剂量与阶段；RTS 用努力和疲劳信息参与调节；Westside 通过不同努力方法与变式组织训练。", "observe": "先看目标、人群、器械、装备、恢复条件和计量口径。不同体系出现的相同百分比未必表示同一件事。", "act": "不要把各体系最困难的部分拼起来。先选择一套能解释、能记录的主结构，再小范围引入确有用途的工具。", "check": "能否说明每次训练的任务、进阶条件与调整依据？解释不了时，先简化结构。", "ref": "《力量训练计划》p.5、13；《RTS》p.15；《Westside 共轭法用户指南》p.5–9", "tags": "体系 共轭 RTS JTS", "deep": [{"title": "深入理解", "text": "体系之间的差别在于如何组织共同原理。Practical Programming 关注适应速度与进阶复杂度；RTS 用自评努力及疲劳组织剂量；Westside 将最大努力、动态努力和辅助训练区分任务。装备、弹力带张力及动作定义会改变百分比的含义。", "kind": "资料归纳", "ref": "《力量训练计划》p.5、13；《RTS》p.15；《Westside 共轭法用户指南》p.5–9"}, {"title": "操作流程", "text": "先写约束：目标、每周可用时间、器械、经验、主要限制和恢复条件。选择能被执行与复盘的一套主结构，保留它的进阶逻辑。需要借用别的工具时，说明借来的部分解决什么问题以及会增加多少负担。", "kind": "综合应用", "ref": "《力量训练计划》p.5、13；《RTS》p.15；《Westside 共轭法用户指南》p.5–9"}, {"title": "误区与边界", "text": "不能把 Westside 的高难度变式测试、另一体系的最大容量和 RTS 的疲劳阈值叠加后仍声称遵循某一体系。同一个名词在不同版本材料中可能有不同实现，必须保留出处和上下文。", "kind": "辨析与限制", "ref": "《力量训练计划》p.5、13；《RTS》p.15；《Westside 共轭法用户指南》p.5–9"}, {"title": "情境示例", "text": "如果已有稳定主项结构，但每日状态波动明显，可以先在该结构内用主观努力辅助选重。没有必要因此立即加入多套变式轮换和新的周训练量规则。", "kind": "教学示例，非个体处方", "ref": "《力量训练计划》p.5、13；《RTS》p.15；《Westside 共轭法用户指南》p.5–9"}]}, {"cat": "squat", "id": "sq-model", "title": "深蹲 · 先理解平衡与身体比例", "lead": "躯干前倾和膝盖前移是负荷分配，不是自动判错项。", "why": "身体与杠铃形成整体系统。股骨、躯干比例及杠位会影响关节力矩和姿势；轻负荷与重负荷的杠铃路径不能用同一个绝对标准判断。", "observe": "侧面看全脚支撑、杠与身体的关系，以及重复间是否突然漂移。不要只截一帧比较谁更直立。", "act": "选择能稳定达到目标幅度的站距、脚角与杠位。一次只改一个主要设置，再复测平衡与深度。", "check": "同负荷下能否更稳定完成目标幅度？调整不能只让照片好看却让动作更难控制。", "ref": "SBS《如何深蹲》p.66、78；《力量训练基础》p.20–22", "tags": "低杠 高杠 膝过脚尖", "deep": [{"title": "深入理解", "text": "外部力矩可用“外力 × 到关节的垂直距离”帮助理解。杠位、股骨与躯干比例改变髋膝力矩分配；身体自身也有重量，所以轻负荷时不能只用杠铃是否垂直运动判断整体平衡。重杠时杠铃在系统质量中的占比更大，路径往往更接近垂直。", "kind": "资料归纳", "ref": "SBS《如何深蹲·终极指南》PDF p.66、78；《力量训练基础》PDF p.20–22"}, {"title": "操作流程", "text": "同一视角拍完整动作，先看足部支撑，再看杠位、躯干与膝髋关系。记录目标深度和个人稳定风格后，只改变站距、脚角或杠位中的一个主要因素。将调整后的平衡、深度和重复质量一起比较。", "kind": "综合应用", "ref": "SBS《如何深蹲·终极指南》PDF p.66、78；《力量训练基础》PDF p.20–22"}, {"title": "误区与边界", "text": "躯干较前倾不自动等于动作错误，膝盖过脚尖也不是统一禁令。真正需要优先排查的是相对本人稳定动作突然增加的偏移、足部失衡，以及不可控制或伴随症状的变化。", "kind": "辨析与限制", "ref": "SBS《如何深蹲·终极指南》PDF p.66、78；《力量训练基础》PDF p.20–22"}, {"title": "情境示例", "text": "两名训练者使用相同重量，一人长股骨短躯干，另一人相反；要求两人保持一样直立可能迫使前者失衡。应各自建立可重复且符合目标的动作，再比较自身进步。", "kind": "教学示例，非个体处方", "ref": "SBS《如何深蹲·终极指南》PDF p.66、78；《力量训练基础》PDF p.20–22"}]}, {"cat": "squat", "id": "sq-setup", "title": "深蹲 · 出杠与支撑是动作的一部分", "lead": "杠在背上稳定、脚下找到支撑，再开始下降。", "why": "不稳定的起始设置会改变下降路径和底部位置。呼吸支撑的目标是建立可维持的躯干刚度，而不是尽量抬胸或把腰拱到极限。", "observe": "看出杠后是否反复挪脚、杠是否滚动、下蹲前躯干是否已经失去可控位置。", "act": "先固定握杠、背部承托、出杠步数与脚位。吸气后向躯干周围建立张力，维持到通过困难区；需要换气时在稳定位置重置。", "check": "连续几次的设置时间、脚位和第一段下降能否一致？在这之前，不急着用更大重量检验。", "ref": "《力量举全书》p.68、76、159–160；Juggernaut《诊断手册》p.11–12", "tags": "腹压 出杠 呼吸 核心", "deep": [{"title": "深入理解", "text": "动作开始前的杠位、承托和躯干位置决定下降的初始条件。呼吸与支撑不是两个互不相干的口令：吸气后需要通过躯干周围肌群维持可控位置，而不是仅把胸抬高或腹部放松向前顶。", "kind": "资料归纳", "ref": "《力量举全书》p.68、76、159–160；Juggernaut《诊断手册》p.11–12"}, {"title": "操作流程", "text": "分四个检查点：背部承托杠铃后是否稳定；出杠能否不改变承托；走步结束能否迅速定位；开始下降前是否完成支撑。先用较轻负荷重复设置，只有四个检查点稳定，才把注意力转向底部技术。", "kind": "综合应用", "ref": "《力量举全书》p.68、76、159–160；Juggernaut《诊断手册》p.11–12"}, {"title": "误区与边界", "text": "腰带可以提供接触反馈，但不能自动建立动作协调。用夸张拱腰追求“挺胸”可能使起始位置偏离可控范围；从这种位置回到中间位又容易被误判为底部塌腰。", "kind": "辨析与限制", "ref": "《力量举全书》p.68、76、159–160；Juggernaut《诊断手册》p.11–12"}, {"title": "情境示例", "text": "如果每次出杠后都重新夹杠、挪脚、抬胸数次，工作组中的不一致可能在下降前已经形成。优先固定设置顺序，比同时加入多个深蹲变式更容易获得清晰反馈。", "kind": "教学示例，非个体处方", "ref": "《力量举全书》p.68、76、159–160；Juggernaut《诊断手册》p.11–12"}]}, {"cat": "squat", "id": "sq-bottom", "title": "深蹲 · 重难点在下降与底部衔接", "lead": "下降要为起身创造位置，而不是只完成“蹲下去”。", "why": "下降速度、膝髋协调与底部张力决定反转时的位置。弹起可以是自然运动的一部分，但失控落底与主动控制下的反转不同。", "observe": "比较首尾重复的深度、脚下受力和底部位置。注意是否临近底部突然塌腰、移重心或丢掉躯干支撑。", "act": "先在能保持控制的负荷上练一致节奏。底部总失去位置，可用短暂停顿减少对反弹的依赖，重新确认支撑与重心。", "check": "回到常规深蹲后，底部位置和起身路径是否更稳定？暂停重量增加只是中间指标。", "ref": "SBS《如何深蹲》p.62、66；Juggernaut《诊断手册》p.12", "tags": "底部 暂停 反弹 深度", "deep": [{"title": "深入理解", "text": "下降和起身是连续过程。底部反转时，髋膝位置与躯干张力影响外部负担如何分配。暂停减少了立即反弹的帮助，也提高了维持位置的要求，因此暂停表现较差本身不等于存在某种弱肌。", "kind": "资料归纳", "ref": "SBS《如何深蹲》p.62、66；Juggernaut《诊断手册》p.12"}, {"title": "操作流程", "text": "先看下降末段是否加速失控，再看最低点是否变成另一个姿势。用能稳住位置的负荷练短暂停顿；保持呼吸支撑与全脚支撑，再按原主项方式推起。暂停练习应减少必要的负荷，而不是强行维持原来重量。", "kind": "综合应用", "ref": "SBS《如何深蹲》p.62、66；Juggernaut《诊断手册》p.12"}, {"title": "误区与边界", "text": "慢下降、暂停和常规反转是不同任务。它们能提供反馈，但不必把所有正式组都变成超慢动作。没有证据支持时，也不要用固定停顿时长或固定周数保证纠正成功。", "kind": "辨析与限制", "ref": "SBS《如何深蹲》p.62、66；Juggernaut《诊断手册》p.12"}, {"title": "情境示例", "text": "常规深蹲下落很快，起身时胸部落后；降重暂停后位置稳定。这个结果支持先改善底部控制的假设，但还需要回到常规节奏验证，不能仅凭暂停完成一次就认定问题已经消失。", "kind": "教学示例，非个体处方", "ref": "SBS《如何深蹲》p.62、66；Juggernaut《诊断手册》p.12"}]}, {"cat": "squat", "id": "sq-hiprise", "title": "深蹲 · 臀先起：先排查位置，再考虑能力", "lead": "髋先明显上升、胸部跟不上，是现象，不是股四头肌弱的诊断。", "why": "下降失衡、底部失去张力、负荷过大或腿部能力不足都可能改变起身策略。低杠本身更前倾，不能与高杠做静态对照后判错。", "observe": "看变化是否从下降开始；比较轻重负荷、首末重复及不同组。找出臀先起之前最早的偏移。", "act": "先降低难度复测，保留稳定重复；位置问题用节奏或暂停练习。只有技术较稳定、问题仍反复出现时，再测试前蹲、腿部辅助或上背能力建设。", "check": "用原主项、同幅度复测胸髋相对运动；如果变式进步但主项仍变形，重新检查假设。", "ref": "SBS《如何深蹲》p.58–62；Juggernaut《诊断手册》p.12", "tags": "早安式 前倾 股四头", "deep": [{"title": "深入理解", "text": "Nuckols 在 p.58–59 解释：膝部提前后移可缩短伸膝的外部力矩臂，同时髋后移和躯干前倾增加髋伸要求，因此身体可能把负担从膝伸转向髋伸。原文把这种模式与股四头肌不足联系起来；本库把它视作训练假设，而非录像即可确认的诊断。", "kind": "资料归纳", "ref": "SBS《如何深蹲·终极指南》PDF p.58–61；Juggernaut《力量举诊断手册》PDF p.12"}, {"title": "操作流程", "text": "依次比较三件事：底部前是否已经向前失衡；是否只有重负荷或组末发生；降低负荷后能否保持胸髋关系。如果设置与控制已稳定，再试前蹲、腿举或分腿蹲等原书提及的能力工具，同时保留主项复测。", "kind": "综合应用", "ref": "SBS《如何深蹲·终极指南》PDF p.58–61；Juggernaut《力量举诊断手册》PDF p.12"}, {"title": "误区与边界", "text": "原书 p.60–61 还用蹲拉成绩差提出支撑能力的解释。这是作者的经验推论，不宜将“硬拉比深蹲高某个百分比”当作个体诊断阈值：风格、体型、深度和训练投入都会影响成绩比。", "kind": "辨析与限制", "ref": "SBS《如何深蹲·终极指南》PDF p.58–61；Juggernaut《力量举诊断手册》PDF p.12"}, {"title": "情境示例", "text": "若轻重负荷都在下降末段失衡，先修设置；若轻量稳定且多次在较重组中以同一方式卸掉膝部负担，腿部能力假设才更值得测试。两种情况看似同样臀先起，训练重点可能不同。", "kind": "教学示例，非个体处方", "ref": "SBS《如何深蹲·终极指南》PDF p.58–61；Juggernaut《力量举诊断手册》PDF p.12"}]}, {"cat": "squat", "id": "sq-knee", "title": "深蹲 · 膝部轨迹与骨盆变化", "lead": "先分清可控的个体运动和随负荷放大的失控变化。", "why": "脚角、站距、髋结构和躯干设置都会影响膝部与骨盆运动。仅凭膝内移或骨盆变化，不能判断某种组织损伤。", "observe": "比较变化是否明显、是否随疲劳加大，以及是否伴随不适或支撑丢失。侧面观察是否从过度拱腰回到中间位置，别把所有变化混为一谈。", "act": "从舒适站距与脚角出发，保持全脚支撑；必要时降低负荷或暂用能控制的幅度。出现不适时走伤病排查流程，不靠“把膝盖推得更外”解决所有情况。", "check": "控制是否改善，目标幅度是否稳定？若调整反而增加不适，不强行坚持提示。", "ref": "SBS《如何深蹲》p.62–63、78；《力量举全书》p.159", "tags": "膝内扣 臀部眨眼 骨盆", "deep": [{"title": "深入理解", "text": "原书 p.63 特别区分：从过度腰椎伸展回到较中间位置，与继续进入明显屈曲不是一回事。骨盆和腰椎在动作中存在运动，单一外观不能直接判断组织耐受或伤情；控制、负荷、幅度和症状需要一起看。", "kind": "资料归纳", "ref": "SBS《如何深蹲》p.62–63、78；《力量举全书》p.159"}, {"title": "操作流程", "text": "从侧面比较起始与底部，再从斜前方观察足部与膝部运动是否重复一致。先优化不过度拱腰的设置，再测试舒适站距和脚角。对明显失控的幅度暂时降低要求，并观察是否能在可控范围建立稳定重复。", "kind": "综合应用", "ref": "SBS《如何深蹲》p.62–63、78；《力量举全书》p.159"}, {"title": "误区与边界", "text": "原书关于结构和活动度的讨论不能替代临床评估。不要根据自拍视频推定髋臼形态，也不必为了追求膝绝不内移而过度外推。若出现症状，动作外观改善也不代表已经排除伤病。", "kind": "辨析与限制", "ref": "SBS《如何深蹲》p.62–63、78；《力量举全书》p.159"}, {"title": "情境示例", "text": "若最初腰部大幅拱起，下降时变成较小弧度，先纠正起始设置再复拍。若在中间位开始仍随深度明显失控，则进一步调整负荷与幅度，必要时求助专业评估。", "kind": "教学示例，非个体处方", "ref": "SBS《如何深蹲》p.62–63、78；《力量举全书》p.159"}]}, {"cat": "squat", "id": "sq-break", "title": "深蹲 · 卡点突破的最小实验", "lead": "一次用一个明确工具，检验一种限制假设。", "why": "底部起不来可能是失去位置，也可能只是重量超出当前能力；中段慢可能是正常力学困难区。必须先看重复模式，再挑工具。", "observe": "保留同角度视频：卡点前是否偏移？普通工作组是否稳定？是每次都卡，还是只在极限尝试失败？", "act": "底部控制差→试暂停；下降不一致→试节奏；位置稳定但腿部能力待积累→保留主项并配腿部辅助。不要同时加多种变式和总量。", "check": "经过一段连续练习，再以相同主项条件比较。若无改善，先查执行和恢复，再决定换假设。", "ref": "Juggernaut《诊断手册》p.12；《力量训练原理》p.42", "tags": "突破 瓶颈 弱点", "deep": [{"title": "深入理解", "text": "变式的价值在于改变特定条件：暂停改变底部反转，节奏改变下降控制，前负重改变姿势约束。辅助则可能以不同疲劳成本发展肌肉。选择前应写出“我为什么认为这个条件限制了主项”。", "kind": "资料归纳", "ref": "Juggernaut《诊断手册》p.12；《力量训练原理》p.42"}, {"title": "操作流程", "text": "建立三个指标：变式自身是否更熟练、常规主项的目标现象是否改善、整个训练的恢复是否仍可接受。先做少量、可恢复的实验，保留原主项中的固定比较组，记录至少多次训练而非一次感觉。", "kind": "综合应用", "ref": "Juggernaut《诊断手册》p.12；《力量训练原理》p.42"}, {"title": "误区与边界", "text": "卡点处本来就可能是当前动作正常的力学困难区。给每个卡点强行匹配一个变式，容易把总体能力不足拆成不存在的局部问题。辅助越多也越难解释究竟哪个调整有效。", "kind": "辨析与限制", "ref": "Juggernaut《诊断手册》p.12；《力量训练原理》p.42"}, {"title": "情境示例", "text": "测试暂停深蹲时，同时把总组数、站距、鞋和饮食全部改掉，结果很难归因。更清晰的试验是尽量保留其他条件，只替换少量对应练习，并使用同一视角观察常规深蹲。", "kind": "教学示例，非个体处方", "ref": "Juggernaut《诊断手册》p.12；《力量训练原理》p.42"}]}, {"cat": "bench", "id": "bp-model", "title": "卧推 · 把身体搭成稳定的支撑系统", "lead": "上背、脚位、握杠和触点共同决定推举条件。", "why": "卧推并非只有胸和手臂。支撑改变会影响触点、推距和肩肘要求；握距与触点应一起理解。", "observe": "看出杠是否拉散上背，双脚是否移动，臀部支撑是否稳定，以及手腕与前臂是否能有效承托杠铃。", "act": "先确定凳面支撑和合适挂钩高度，固定上背与脚位，再测试舒适握距。避免靠极端起桥或极宽握距追求短推距。", "check": "出杠后到触胸前，支撑是否仍保持？如果第一下与后续几下设置不同，先解决这个问题。", "ref": "SBS《如何卧推》p.27、35、38–41", "tags": "设置 肩胛 起桥 握距", "deep": [{"title": "深入理解", "text": "肩屈、肩水平屈和伸肘共同参与卧推。握距改变横向距离，触点与路径改变杠相对肩的位置；身体的稳定支撑让这些关系能够重复。起桥不是独立的万能技巧，而是支撑结构的一部分。", "kind": "资料归纳", "ref": "SBS《如何卧推·终极指南》PDF p.27、35、40–41"}, {"title": "操作流程", "text": "先定凳面与脚下支撑，再调挂钩高度，最后确定握距。出杠后暂停确认是否仍保持上背位置；轻负荷测试触胸时前臂与杠的承托关系。记录自己稳定设置，不用同伴的身体比例替代自己的测试。", "kind": "综合应用", "ref": "SBS《如何卧推·终极指南》PDF p.27、35、40–41"}, {"title": "误区与边界", "text": "宽握缩短幅度的同时会改变关节要求，不应简单等同于更省力或更危险。原书中的比赛要求属于当时与特定组织语境，备赛需另核对参赛组织当前规则。", "kind": "辨析与限制", "ref": "SBS《如何卧推·终极指南》PDF p.27、35、40–41"}, {"title": "情境示例", "text": "一名训练者下降时总想夹紧肩胛，但问题实际上是挂钩太高、出杠必须抬肩。把设置完整录像后，会发现张力在第一下开始前已经丢失；先解决挂钩和出杠更有针对性。", "kind": "教学示例，非个体处方", "ref": "SBS《如何卧推·终极指南》PDF p.27、35、40–41"}]}, {"cat": "bench", "id": "bp-touch", "title": "卧推 · 触点与下放控制", "lead": "稳定触点让每次重复成为同一种任务。", "why": "触点过高或过低会改变肩肘力矩与推起路径。下放失控、弹胸或出杠失稳会让底部条件每次不同。", "observe": "从侧前方看触点、前臂承托和左右对称性；从侧面看下放与推起的连接。不要把一个固定肘角当成所有人的标准。", "act": "用可控负荷练重复触点；下放保持张力，暂停时不主动放松身体。先找到舒适且可重复的位置，再增加难度。", "check": "同组触点是否集中、推起是否连贯？触点固定后再分析卡点才更有意义。", "ref": "SBS《如何卧推》p.38–41", "tags": "触胸 下放 肘角 暂停", "deep": [{"title": "深入理解", "text": "p.38 讨论用一致触点建立重复轨迹；p.39 区分常见软暂停和高级下沉策略。暂停时保持肌肉张力与身体支撑，是普通训练更容易复查的条件；刻意放松让杠压入身体会改变任务。", "kind": "资料归纳", "ref": "SBS《如何卧推·终极指南》PDF p.38–39"}, {"title": "操作流程", "text": "每组先固定握距和脚位，在可控负荷下记录连续几次触点。若触点分散，检查下放是否突然失速、左右承托是否不同、上背是否滑动。将触点与推起轨迹一起调整，避免只把杠“移到更低的位置”。", "kind": "综合应用", "ref": "SBS《如何卧推·终极指南》PDF p.38–39"}, {"title": "误区与边界", "text": "原书提到约 2–3 秒的控制下放，这是其技术建议，不是所有组必须计时的标准。下降越慢不一定越好，关键是能保持既定任务。原文高级下沉技术不宜变成新手的弹胸指令。", "kind": "辨析与限制", "ref": "SBS《如何卧推·终极指南》PDF p.38–39"}, {"title": "情境示例", "text": "如果同组触点逐次下移，同时推起越来越靠腹部，先降低负荷统一触点再看卡点。此时增加三头辅助可能提高另一种能力，却未处理触点漂移造成的难度变化。", "kind": "教学示例，非个体处方", "ref": "SBS《如何卧推·终极指南》PDF p.38–39"}]}, {"cat": "bench", "id": "bp-drive", "title": "卧推 · 推起轨迹与腿部驱动", "lead": "腿部驱动支持推举，杠铃通常向上并向肩部回移。", "why": "触胸时杠在肩前，向上向后回移可改变肩部负担。轨迹与肘部运动要协调，不能只把杠拉向头部。", "observe": "看是否先直上后猛向后拐，或一开始就过度后移。观察腿发力时臀部是否被顶离凳面。", "act": "先固定脚位和上背接触，再让腿部持续提供稳定支持。轻负荷练连贯推起路线，以舒适、可控和重复一致为依据。", "check": "腿驱动是否改善稳定性而非破坏支撑？轨迹改变后触点与锁定是否更连贯？", "ref": "SBS《如何卧推》p.39–41", "tags": "腿驱 J形轨迹 杠路", "deep": [{"title": "深入理解", "text": "p.41 的核心是杠与肩之间的前后距离会影响肩屈的外部需求。从较低触点向上并向肩部回移，是减少这段距离的一种方式；横向握距造成的需求并不会因为路径回移就消失。", "kind": "资料归纳", "ref": "SBS《如何卧推·终极指南》PDF p.39–41"}, {"title": "操作流程", "text": "先在轻量下形成可重复触点，再观察杠在离胸后是连贯回移还是突然转弯。腿驱动先作为稳定身体的持续支持，确认臀部与上背接触不被破坏，再协调更用力的推起。选择能解释动作的少量提示。", "kind": "综合应用", "ref": "SBS《如何卧推·终极指南》PDF p.39–41"}, {"title": "误区与边界", "text": "“向后推”不等于把杠猛拉向脸或架钩，也不要求所有人画相同 J 形。轨迹需要与肩部舒适度、握距和触点匹配；若一个提示让支撑松动或明显不适，应停止机械重复。", "kind": "辨析与限制", "ref": "SBS《如何卧推·终极指南》PDF p.39–41"}, {"title": "情境示例", "text": "一名训练者用腿一蹬就抬臀，说明当前发力方式破坏了任务条件。可先在更轻负荷练持续支撑，而不是继续增大腿驱动；重新稳定后再比较同样停顿下的推举。", "kind": "教学示例，非个体处方", "ref": "SBS《如何卧推·终极指南》PDF p.39–41"}]}, {"cat": "bench", "id": "bp-chest", "title": "卧推 · 离胸失败的诊断顺序", "lead": "先排查支撑、触点与暂停，再考虑额外底部训练。", "why": "离胸困难可能来自底部张力丢失、触点不合适，也可能是重量超过当前整体能力。不能仅凭失败位置判定胸肌弱。", "observe": "比较暂停与非暂停、轻重负荷及首末重复。观察胸部是否在停顿后下沉，上背是否松动。", "act": "先练稳定暂停与常规轨迹；若技术稳定仍缺乏底部能力，可把暂停卧推作为小规模实验，配合整体上肢能力建设。", "check": "回到同样停顿标准下，离胸是否更稳定、同重量努力是否下降？不是只看触胸反弹的成绩。", "ref": "SBS《如何卧推》p.38–41、61–64", "tags": "离胸 胸肌 底部弱", "deep": [{"title": "深入理解", "text": "p.61 指出肌肉的长度—张力、内部力臂和牵张效应共同作用，因此不能仅凭关节力矩推定哪块肌肉导致失败。p.62–64 的弱点建议建立在设置与技术背景之上，离胸困难也可能源自不利触点和轨迹。", "kind": "资料归纳", "ref": "SBS《如何卧推·终极指南》PDF p.39、61–64"}, {"title": "操作流程", "text": "先把暂停条件统一；从接手杠铃开始检查上背与胸廓支撑。若触点、停顿和轨迹稳定，再比较相近工作任务的离胸表现。暂停卧推用于测试保持张力的能力；增加总体上肢力量的动作则用于长期建设。", "kind": "综合应用", "ref": "SBS《如何卧推·终极指南》PDF p.39、61–64"}, {"title": "误区与边界", "text": "暂停组重量下降是任务差异的一部分，不应被当成胸肌无力的直接证据。也不能用一次极限失败就决定增加某一肌群的大量训练，因为问题可能是整体能力达到当前上限。", "kind": "辨析与限制", "ref": "SBS《如何卧推·终极指南》PDF p.39、61–64"}, {"title": "情境示例", "text": "非暂停可以推起、暂停失败时，先问暂停时是否真的维持相同身体支撑。如果暂停导致胸廓塌下，优先练稳定暂停；如果条件稳定，则可能需要该任务下的整体能力积累。", "kind": "教学示例，非个体处方", "ref": "SBS《如何卧推·终极指南》PDF p.39、61–64"}]}, {"cat": "bench", "id": "bp-lock", "title": "卧推 · 中段与锁定不等于“三头弱”", "lead": "关节角度、轨迹与整体力量共同决定困难区。", "why": "肌肉的力臂和发力能力随位置改变，失败发生的位置未必就是问题的来源。锁定困难也可能是先前轨迹或肘位造成的。", "observe": "先看卡点之前杠铃与肘的关系。确认是不是偶发极限失败，还是正常工作组里反复出现同一种停滞。", "act": "先调整连贯的推起轨迹。若位置稳定，可测试窄距卧推或伸肘辅助的价值，保持主项练习，不把所有卧推替换成半程。", "check": "主项中段通过是否改善？如果只有窄距或半程成绩提高，不能直接宣布弱点已解决。", "ref": "SBS《如何卧推》p.61–64", "tags": "中段 三头 锁定", "deep": [{"title": "深入理解", "text": "原书把锁定困难分为肘部位置不利与整体能力等可能性。它同时提醒，某些训练者可能没有突出的专项弱点，只需继续提高卧推力量；不是每个失败位置都值得单独开一个专项。", "kind": "资料归纳", "ref": "SBS《如何卧推·终极指南》PDF p.61、63–64"}, {"title": "操作流程", "text": "逐帧回看卡点之前：杠是否及时回移、肘是否与路径协调、支撑是否还在。技术稳定后，可用适度窄距或伸肘辅助检验能力假设，记录主项是否受益，而非自动用半程取代完整卧推。", "kind": "综合应用", "ref": "SBS《如何卧推·终极指南》PDF p.61、63–64"}, {"title": "误区与边界", "text": "锁定外观慢不等于三头必须加量。半程推距更短、负荷可能更大，却不保证主项整个发力链改善；如果前半程已经位置不利，顶端练得更强也可能无法迁移。", "kind": "辨析与限制", "ref": "SBS《如何卧推·终极指南》PDF p.61、63–64"}, {"title": "情境示例", "text": "如果杠总在胸前很远处垂直上推，到中段才急着向后，先练连贯路径；若路径与支撑稳定而多次在相似位置受限，再测试辅助能力，比较原主项的通过速度与完成率。", "kind": "教学示例，非个体处方", "ref": "SBS《如何卧推·终极指南》PDF p.61、63–64"}]}, {"cat": "bench", "id": "bp-progress", "title": "卧推 · 技术收益与肌肉积累并行", "lead": "技术更稳后，长期进步仍需要能力建设。", "why": "初期设置和轨迹改善可能带来明显收益；技术接近稳定后，一味寻找新提示未必能继续提高，肌肉与可承受训练量也影响潜力。", "observe": "看过去一段时间是技术不断变化，还是同标准下长期停滞。观察训练量是否能稳定完成，而非只看一次 PR。", "act": "保留高质量主项练习，按可恢复程度分配训练量，用少量辅助支持胸、肩、伸肘与上背发展。饮食与恢复同步检查。", "check": "在一致标准下，工作组表现和长期趋势是否改善？不为了多练而牺牲每次支撑和触点。", "ref": "SBS《如何卧推》p.80；SBS《旅程》p.41", "tags": "卧推频率 增肌 平台", "deep": [{"title": "深入理解", "text": "p.80 将成熟技术后的长期卧推潜力与上半身肌肉发展联系起来。SBS《旅程》p.41 的中级示例则把主要动作练习与辅助容量分开组织；这是某种发展阶段的安排，不是所有人必须照搬的容量分配。", "kind": "资料归纳", "ref": "SBS《如何卧推·终极指南》PDF p.80；SBS《旅程》PDF p.41"}, {"title": "操作流程", "text": "先确认主项有稳定练习机会，再在可恢复条件下发展支持肌群。把每周总量和单次分配写明，观察是否因单次过量导致后半程动作质量下降。若调整频率，先区分重新分配总量与真正增加总量。", "kind": "综合应用", "ref": "SBS《如何卧推·终极指南》PDF p.80；SBS《旅程》PDF p.41"}, {"title": "误区与边界", "text": "技术提示能迅速改善表达，但不能无限替代肌肉和训练能力建设。另一方面，增肌不应以完全停止主项练习为前提；需要同时维护动作任务的熟练度。", "kind": "辨析与限制", "ref": "SBS《如何卧推·终极指南》PDF p.80；SBS《旅程》PDF p.41"}, {"title": "情境示例", "text": "若几个月都在改握距和触点，没有任何固定标准，就难判断肌肉建设是否真的没效果。先冻结主要技术条件，用一段连续记录评估容量、饮食与主项表现。", "kind": "教学示例，非个体处方", "ref": "SBS《如何卧推·终极指南》PDF p.80；SBS《旅程》PDF p.41"}]}, {"cat": "deadlift", "id": "dl-model", "title": "硬拉 · 传统与相扑是不同解决方案", "lead": "选能稳定输出的风格，而不是推距最短或看起来最强的风格。", "why": "站距改变髋膝要求、平衡与动作幅度。身体比例、髋部舒适度和经验影响风格适配，不能靠一次体验比较。", "observe": "观察起始位置能否稳定、杠是否靠近、离地时是否保持平衡、锁定是否自然。新风格的低熟练度要计入判断。", "act": "从保守负荷熟悉两种风格，逐步形成稳定设置。相扑不必追求最大站距；传统也不必追求某个固定髋高。", "check": "多次可比练习后，比较一致性、舒适度与输出，再确定主风格。", "ref": "SBS《如何硬拉》p.75、93、97–100；Juggernaut《诊断手册》p.22", "tags": "传统 相扑 站距", "deep": [{"title": "深入理解", "text": "相扑与传统改变膝髋外部力矩、躯干姿势和发力路径。原书强调相扑常在地面更困难，传统的困难区可能更靠中段。不同风格的失败位置应在各自背景下解释，不能把“离地慢”统一当成异常。", "kind": "资料归纳", "ref": "SBS《如何硬拉·终极指南》PDF p.96–100"}, {"title": "操作流程", "text": "在保守负荷下分别建立稳定设置，记录站距、脚角、握距和起拉位置。比较的是多次练习后能否稳定输出，而不是第一天谁更重。选择主风格后，其他风格仍可作为有任务的变式。", "kind": "综合应用", "ref": "SBS《如何硬拉·终极指南》PDF p.96–100"}, {"title": "误区与边界", "text": "推距较短不必然意味着整体更有利，超宽站距也可能让某人难以自然完成髋伸。不能凭照片判断髋结构，更不能把精英的站距作为自己应该达到的标准。", "kind": "辨析与限制", "ref": "SBS《如何硬拉·终极指南》PDF p.96–100"}, {"title": "情境示例", "text": "若相扑离地费力但一旦过地面就顺畅完成，这可能符合正常风格特点。应先看设置和整体能力，而不是立刻加大量垫高拉去修补一个未必存在的特殊弱点。", "kind": "教学示例，非个体处方", "ref": "SBS《如何硬拉·终极指南》PDF p.96–100"}]}, {"cat": "deadlift", "id": "dl-tension", "title": "硬拉 · 起拉前先消除松弛", "lead": "先形成身体与杠铃的张力，再让杠铃离地。", "why": "猛拽容易让预先设置在受力瞬间改变。背阔肌参与有助于控制杠与身体的关系，但不需要把肩胛强行夹到最大。", "observe": "看离地前杠是否滚动、髋是否先上窜、手臂是否突然受冲击。真正发力位置是否与准备姿势不同？", "act": "摆脚和杠位后握杠、建立支撑，逐渐拉紧系统；从可控制负荷练稳定起始位置，而不是追求更响的起拉。", "check": "张力建立后，起拉是否更平顺，髋肩变化是否更一致？", "ref": "SBS《如何硬拉》p.75、93；《力量举全书》p.193", "tags": "松弛 起拉 背阔 腹压", "deep": [{"title": "深入理解", "text": "p.75 解释背阔肌参与与肩胛位置的作用是改变杠与身体之间的力学关系，而不是单纯把上背夹紧。起拉前建立张力，让身体、握持与杠铃形成受力系统，可减少发力瞬间设置突然改变。", "kind": "资料归纳", "ref": "SBS《如何硬拉·终极指南》PDF p.75、93；《力量举全书》PDF p.193"}, {"title": "操作流程", "text": "先固定脚与杠的位置，再握杠和建立躯干支撑；逐渐施力，观察髋、肩与杠是否开始同时进入可控运动。若预摆髋位很低但一施力就上升，回看实际有效起拉位置，而不是不断把髋压回更低。", "kind": "综合应用", "ref": "SBS《如何硬拉·终极指南》PDF p.75、93；《力量举全书》PDF p.193"}, {"title": "误区与边界", "text": "“拉紧”不等于先用弯肘把杠拽起来；也不需要把肩胛后缩到极限或把胸抬到无法维持的位置。口令是否有效，应通过杠位和重复质量检验。", "kind": "辨析与限制", "ref": "SBS《如何硬拉·终极指南》PDF p.75、93；《力量举全书》PDF p.193"}, {"title": "情境示例", "text": "看似每次髋先起，但录像显示杠尚未离地时髋就在寻找另一个位置。此时先优化起始设置与张力，比用更大重量练猛拽更能解释问题。", "kind": "教学示例，非个体处方", "ref": "SBS《如何硬拉·终极指南》PDF p.75、93；《力量举全书》PDF p.193"}]}, {"cat": "deadlift", "id": "dl-floor", "title": "硬拉 · 离地慢先看风格与设置", "lead": "相扑地面慢并不罕见，传统也不能只靠更低髋位解决。", "why": "不同风格的正常困难区不同。相扑常在地面更难，髋太低或太高都可能破坏有效发力；离地慢不一定存在特殊弱点。", "observe": "比较杠离地前后的髋高、膝位置与重心。看是否只是接近最大能力时自然变慢。", "act": "先用能维持位置的负荷重复起拉。如果只在最后几次失去位置，减少每组次数或调整负担。暂停离地练习用于验证位置控制。", "check": "同一设置下能否在更多重复中保持位置？不要用暂停练习本身的重量取代主项反馈。", "ref": "SBS《如何硬拉》p.93、97、99", "tags": "地面慢 离地弱 髋先起", "deep": [{"title": "深入理解", "text": "p.97 提醒：相扑地面最弱并不自动代表特殊弱点；p.99 的重点是使用能保持髋位的重量和次数，以高质量重复改善前段。这里的“维持位置”不是冻结所有关节，而是避免失去原定发力策略。", "kind": "资料归纳", "ref": "SBS《如何硬拉·终极指南》PDF p.97、99"}, {"title": "操作流程", "text": "比较杠离地前与刚离地后的髋膝位置，再比较首末重复。如果前几次稳定、后几次变化，先减少组内重复或重新分配负担；若每次都变化，先检查站距、杠位和张力。暂停离地可用来放大位置反馈。", "kind": "综合应用", "ref": "SBS《如何硬拉·终极指南》PDF p.97、99"}, {"title": "误区与边界", "text": "赤字硬拉会增加幅度需求，不是所有离地慢都应增加幅度。原书某个百分比下的例子说明如何按技术边界选负荷，不是统一规定所有人必须低于该百分比。", "kind": "辨析与限制", "ref": "SBS《如何硬拉·终极指南》PDF p.97、99"}, {"title": "情境示例", "text": "工作组前五次位置稳定、第六次起髋明显，首先可以把组内重复控制在稳定范围，并观察其他组质量。不要一边允许更多变形，一边把它解释成“练弱点就要硬顶”。", "kind": "教学示例，非个体处方", "ref": "SBS《如何硬拉·终极指南》PDF p.97、99"}]}, {"cat": "deadlift", "id": "dl-knee", "title": "硬拉 · 过膝失败先排查杠与重心", "lead": "前段失位可能让后段看起来像锁定无力。", "why": "杠离身体远、重心偏向脚尖、起拉时髋位改变，都可能增加过膝与锁定难度。只练顶端未必处理了源头。", "observe": "侧面看杠是否绕膝，过膝时是否向前漂，髋是否过早抬高。相扑尤其要看是否丢掉膝伸展参与。", "act": "先重新建立地面位置与贴近路径；用较轻负荷复测。暂停膝下或分段练习可提供位置反馈，但不能用更重半程掩盖完整动作问题。", "check": "完整硬拉里前后阶段能否更连贯？如果半程强、全程仍失败，继续检查起拉和过渡。", "ref": "SBS《如何硬拉》p.96–100", "tags": "过膝 膝下 绕膝", "deep": [{"title": "深入理解", "text": "p.96–100 的分析中，起拉时髋位变化和过膝时重心向前都可能制造中后段困难。卡在膝部可能是之前阶段已经偏移的结果，因此把保护杠设在卡点处练更重负荷，未必解决完整动作的连接。", "kind": "资料归纳", "ref": "SBS《如何硬拉·终极指南》PDF p.96–100"}, {"title": "操作流程", "text": "从离地前开始回看，观察杠是否先向前绕行、膝是否阻挡路径、过膝时足部受力是否前移。先用轻负荷保持同样风格完成全程，再用暂停膝下或分段练习确认具体阶段的控制。", "kind": "综合应用", "ref": "SBS《如何硬拉·终极指南》PDF p.96–100"}, {"title": "误区与边界", "text": "“贴腿”不是不惜代价用杠刮伤皮肤；更靠近也不能靠把身体推离平衡来实现。架上拉与地面硬拉的起始条件不同，成绩不能直接换算成主项进步。", "kind": "辨析与限制", "ref": "SBS《如何硬拉·终极指南》PDF p.96–100"}, {"title": "情境示例", "text": "如果膝下暂停练习能稳住位置，常规硬拉却仍急于拉起而向前漂，下一步是把控制转回原动作，不是继续增加暂停练习的重量直到主项自动改善。", "kind": "教学示例，非个体处方", "ref": "SBS《如何硬拉·终极指南》PDF p.96–100"}]}, {"cat": "deadlift", "id": "dl-lock", "title": "硬拉 · 锁定是站直，不是向后甩腰", "lead": "先有合适位置，再谈顶端能力。", "why": "锁定需要完成髋膝伸展。相扑站距过宽、前段失衡或姿势变化都可能使最后一段变难；局部能力不足只是可能原因之一。", "observe": "看是否仍在脚尖上、杠是否远离身体、髋是否能自然到位。不要以躯干后仰幅度判断锁定质量。", "act": "先调整站距、平衡和前段位置。若整体位置稳定仍反复受限，再考虑臀桥或适当幅度的分段拉作为能力实验。", "check": "以完整动作中的站直与稳定为反馈，不以架上拉或臀桥 PR 直接推断迁移。", "ref": "SBS《如何硬拉》p.96、99–100", "tags": "锁定 臀部 架上拉", "deep": [{"title": "深入理解", "text": "原书区分了特定范围髋伸能力与位置问题。对于相扑，p.100 尤其强调过膝时重心过于向前或站距过宽会阻碍完成；p.99 才在能力假设下讨论臀桥和适当幅度拉类。这个先后关系不能倒置。", "kind": "资料归纳", "ref": "SBS《如何硬拉·终极指南》PDF p.96、99–100"}, {"title": "操作流程", "text": "观察锁定前是否已偏向脚尖、杠是否离开身体、膝髋能否自然完成伸展。先用保守负荷调整站距和脚角，再决定是否需要辅助建设。保持全程复测，不只在膝高处寻找最能拉重的姿势。", "kind": "综合应用", "ref": "SBS《如何硬拉·终极指南》PDF p.96、99–100"}, {"title": "误区与边界", "text": "后仰不是锁定更充分的证明，反而会改变目标任务。宽站姿臀桥或架上拉更强，也不能证明相扑地面到锁定的完整链条更好。出现腰背不适时不靠继续后仰去完成动作。", "kind": "辨析与限制", "ref": "SBS《如何硬拉·终极指南》PDF p.96、99–100"}, {"title": "情境示例", "text": "如果站距稍收窄后在轻量全程中更容易站直，可先熟悉这一设置再比较；但单次轻量改善不能证明长期最优，更不能据此给所有相扑训练者推荐同一站距。", "kind": "教学示例，非个体处方", "ref": "SBS《如何硬拉·终极指南》PDF p.96、99–100"}]}, {"cat": "deadlift", "id": "dl-fatigue", "title": "硬拉 · 把技术练习与高成本训练分开", "lead": "硬拉训练的价值要连同它对后续训练的影响评价。", "why": "组次、负荷、风格和个人习惯都会改变疲劳成本。“所有硬拉都最伤神经”不是可操作的个体判断。", "observe": "观察高负担硬拉后，深蹲或下一次硬拉的完成是否持续受影响；区分全身恢复与单次动作质量问题。", "act": "先减少无任务的额外高难度拉类动作，调整单次量或分配；技术练习采用能保持位置的负荷。不要将每次硬拉都变成最大测试。", "check": "在保留有效主项练习的同时，其他训练是否恢复可完成性？", "ref": "《力量训练原理》p.18–20；SBS《如何硬拉》p.99；《计划致胜》p.14", "tags": "硬拉疲劳 恢复 成本", "deep": [{"title": "深入理解", "text": "应分别看单组难度、单次训练负担与全周拉类动作总量。传统、相扑、罗马尼亚硬拉和各类架上拉可能同时占用下背与髋部相关训练资源，不能因为名称不同就忽略重叠。", "kind": "资料归纳", "ref": "《力量训练原理》p.18–20；SBS《如何硬拉》p.99；《计划致胜》p.14"}, {"title": "操作流程", "text": "把一周所有高难度拉类与深蹲列在时间线上；记录后续表现何时下降、是否反复与某次高负担训练相邻。先减少无明确任务的重叠动作或组末失控重复，再观察其他项目是否恢复。", "kind": "综合应用", "ref": "《力量训练原理》p.18–20；SBS《如何硬拉》p.99；《计划致胜》p.14"}, {"title": "误区与边界", "text": "“中枢神经负担最大”这类概括不能直接决定每个人的恢复天数。肌肉酸痛、心理厌倦和工作组下降也不是同一件事；需要可比较的任务记录，而非单一疲劳标签。", "kind": "辨析与限制", "ref": "《力量训练原理》p.18–20；SBS《如何硬拉》p.99；《计划致胜》p.14"}, {"title": "情境示例", "text": "如果重硬拉日后深蹲连续失去质量，同时还安排重架上拉，可先缩减缺少明确迁移任务的架上拉。保留硬拉主项，比较总负担变化是否提高全周执行。", "kind": "教学示例，非个体处方", "ref": "《力量训练原理》p.18–20；SBS《如何硬拉》p.99；《计划致胜》p.14"}]}, {"cat": "diagnosis", "id": "evidence", "title": "弱点诊断 · 从现象到证据链", "lead": "现象 → 假设 → 小实验 → 主项复测，四步不能跳过。", "why": "卡点受技术、负荷、疲劳与能力共同影响。肉眼观察只能提出训练假设，不能像医学检查一样确认某块肌肉或组织的问题。", "observe": "完整录像，记录哪组哪次开始变化；比较轻重、首尾、疲劳前后以及稳定动作与失败动作。", "act": "先写可推翻的假设。例如“底部位置不稳定参与了起身变形”，用降重或暂停检验，而不是直接断言核心弱。", "check": "实验后回到原主项和原标准比较。能解释和预测后续表现，比一个听起来专业的标签更有用。", "ref": "《力量举全书》p.159–160；SBS《如何卧推》p.61；Juggernaut《诊断手册》p.12", "tags": "诊断 视频 实验 假设", "deep": [{"title": "深入理解", "text": "观察事实与原因解释必须分开。事实是“第四次开始髋先上升”，解释可能是疲劳、初始位置或能力限制。一个好假设应能预测：在什么条件改变后，现象应该随之改变；如果不变，就需要重审。", "kind": "资料归纳", "ref": "《力量举全书》p.159–160；SBS《如何卧推》p.61；Juggernaut《诊断手册》p.12"}, {"title": "操作流程", "text": "使用四栏记录：①现象及时间点；②至少两个可能解释；③一次只改变一个主要条件；④回到原任务复测。将轻重负荷、首末重复和不同训练日作为对照，不必把普通训练变成频繁最大测试。", "kind": "综合应用", "ref": "《力量举全书》p.159–160；SBS《如何卧推》p.61；Juggernaut《诊断手册》p.12"}, {"title": "误区与边界", "text": "没有对照就很容易把自然波动当成治疗效果。看到一次改善只能提高某个解释的可信度，不能确认肌肉、关节或组织病因。训练弱点检查和医学诊断是不同工作。", "kind": "辨析与限制", "ref": "《力量举全书》p.159–160；SBS《如何卧推》p.61；Juggernaut《诊断手册》p.12"}, {"title": "情境示例", "text": "例如暂停后触点更稳定，支持“底部控制参与问题”的解释；若暂停不影响触点，但换合适挂钩后立即更稳，则出杠设置可能是更早的环节。两种解释都应允许被证据推翻。", "kind": "教学示例，非个体处方", "ref": "《力量举全书》p.159–160；SBS《如何卧推》p.61；Juggernaut《诊断手册》p.12"}]}, {"cat": "diagnosis", "id": "triage", "title": "平台期 · 先确认是真停滞", "lead": "标准不同、当天波动和长期平台必须分开。", "why": "更短幅度、更少停顿或不同器械会制造表面进步；短期疲劳也会遮住已有能力。一次失败不值得立刻更换整个安排。", "observe": "对照连续训练记录中的动作标准、体重、次数与努力程度。检查是否漏练、临时加量或不断改动作。", "act": "执行不稳定先解决执行；生活与训练负担同步变化先查恢复；在条件可比、连续无进步时再分析刺激与限制因素。", "check": "是否能用记录清楚描述“在哪个条件下、持续多久、哪个指标没动”？描述不清时先收集数据。", "ref": "《计划致胜》p.14、20；《力量训练原理》p.18", "tags": "平台 波动 停滞", "deep": [{"title": "深入理解", "text": "平台的判断对象不是模糊的“最近不强”，而是具体任务中的趋势。不同阶段的目标不一样：容量期可以看工作能力，技术期可以看重复质量，表达期才更重视高负荷专项成绩。", "kind": "资料归纳", "ref": "《计划致胜》p.14、20；《力量训练原理》p.18"}, {"title": "操作流程", "text": "先问动作标准是否改变，再问执行是否完整，然后看体重、恢复和训练总负担是否同步变化。只有条件可比时，才把连续无进步作为修改刺激的依据；单项停滞与多项一起下降应分别考虑。", "kind": "综合应用", "ref": "《计划致胜》p.14、20；《力量训练原理》p.18"}, {"title": "误区与边界", "text": "不断更换动作和测最大会破坏比较条件。也不能把短期下降都解释成疲劳：执行不足、技术改变、饮食和生活变化都需要核对。没有记录时应先建立基线，而不是立刻换体系。", "kind": "辨析与限制", "ref": "《计划致胜》p.14、20；《力量训练原理》p.18"}, {"title": "情境示例", "text": "卧推最大重量没变，但固定停顿下的工作组从难以完成变成稳定完成，这可能是有用进步。若只盯一次最大重量，会忽略任务能力变化并过早打断原安排。", "kind": "教学示例，非个体处方", "ref": "《计划致胜》p.14、20；《力量训练原理》p.18"}]}, {"cat": "diagnosis", "id": "experiment", "title": "突破 · 一次只做一个有理由的改变", "lead": "调整是实验，不是把所有可能有效的方法一次叠上去。", "why": "同时加频率、加组、换动作和改变饮食，会让结果难以解释。小范围调整更容易判断收益与成本。", "observe": "选一个主要问题、一种观察方法和一个主要调整；保留其他条件尽可能稳定。", "act": "技术假设先测试设置或控制；剂量假设调整一个训练旋钮；恢复假设先处理明显的生活与饮食变化。给连续记录留下比较机会。", "check": "预先写下成功条件和停止条件：主项改善、完成更稳定，或反而不适加重、后续持续受影响。结果不支持就重审假设。", "ref": "《力量训练原理》p.18–20、42；《力量举全书》p.159", "tags": "突破 加量 调整", "deep": [{"title": "深入理解", "text": "任何训练修改同时包含预期收益与额外成本。实验应明确“成功”是什么，例如触点更稳定、同任务努力下降或连续完成率改善，而不是训练后某个肌群更酸。", "kind": "资料归纳", "ref": "《力量训练原理》p.18–20、42；《力量举全书》p.159"}, {"title": "操作流程", "text": "写下起始条件、主要改动、观察指标与停止条件。先保留足够多的原主项比较机会。若引入变式，就考虑替换部分原有负担而不是全部叠加；若提高频率，先说明周量是否变化。", "kind": "综合应用", "ref": "《力量训练原理》p.18–20、42；《力量举全书》p.159"}, {"title": "误区与边界", "text": "不能事后为了维护方案而不断改成功标准。如果主项无改善且恢复更差，即使变式数字上涨，也应检查其机会成本。个体反应需要时间观察，但这不等于任何方法都可以无限期试下去。", "kind": "辨析与限制", "ref": "《力量训练原理》p.18–20、42；《力量举全书》p.159"}, {"title": "情境示例", "text": "假设是“单次卧推过量影响后半程质量”，可以先把相同周量分配到两次。若后半程质量提高、总执行更稳定，支持分配调整；这仍不能证明更高总量一定有效。", "kind": "教学示例，非个体处方", "ref": "《力量训练原理》p.18–20、42；《力量举全书》p.159"}]}, {"cat": "diagnosis", "id": "deload", "title": "减载 · 用恢复后的反馈校准安排", "lead": "减载是管理疲劳的工具，不能修复所有训练问题。", "why": "训练难度或训练量暂时下降，可以改变恢复负担；但技术混乱、目标不清和长期剂量不合适需要另外处理。", "observe": "观察是多项表现一起下降，还是单项技术改变；检查最近总负担是否上升。不要只用酸痛判断是否要减载。", "act": "按原训练成本减少负担，保留能舒适完成的练习。恢复训练时逐步累积，不直接回到所有变量的最高值。", "check": "若表现恢复，疲劳可能参与了下降；若没有，进一步检查标准、执行与恢复条件，不立即增加更多训练。", "ref": "《力量训练原理》p.15、18；JTS《力量举计划设计手册》p.20", "tags": "减载 疲劳 恢复周", "deep": [{"title": "深入理解", "text": "疲劳消退和训练能力变化不是同一件事。暂时降低负担后成绩回升，说明疲劳可能参与遮蔽，但不意味着旧安排应原样重复；如果每次回到相同负担都迅速下降，应重审长期剂量。", "kind": "资料归纳", "ref": "《力量训练原理》PDF p.15、50–51、84–85；JTS《力量举计划设计手册》PDF p.20"}, {"title": "操作流程", "text": "明确要减少的是组数、负荷、努力程度还是额外动作。保留能舒适完成且有技术价值的任务，再观察多次表现。重启时逐步恢复重点，不把减载后精神好当成可以一次补回所有训练的信号。", "kind": "综合应用", "ref": "《力量训练原理》PDF p.15、50–51、84–85；JTS《力量举计划设计手册》PDF p.20"}, {"title": "误区与边界", "text": "没有材料依据时，不给所有人统一降重百分比、组数比例和固定周期。减载也不能替代对疼痛、疾病、长期睡眠问题或明显技术变化的评估。", "kind": "辨析与限制", "ref": "《力量训练原理》PDF p.15、50–51、84–85；JTS《力量举计划设计手册》PDF p.20"}, {"title": "情境示例", "text": "减少额外高难度组后，原工作组恢复稳定，下一轮可从较低负担重新累积，并观察反应；若恢复条件没有改变，表现却仍持续恶化，不应自动解释为“减载不够狠”。", "kind": "教学示例，非个体处方", "ref": "《力量训练原理》PDF p.15、50–51、84–85；JTS《力量举计划设计手册》PDF p.20"}]}, {"cat": "recovery", "id": "energy", "title": "营养 · 先解决能量，再优化细节", "lead": "身体成分目标与训练表现需要放在同一张账上。", "why": "总能量影响体重趋势，营养结构影响饮食质量与训练支持。某个热量估算只是起点，不能代替个人实际趋势。", "observe": "用相似条件下的体重记录形成平均趋势，同时观察训练表现、食欲和饮食执行。不要把单日涨跌当成脂肪改变。", "act": "先明确维持、缓慢增重或减脂目标，采用可执行的饮食结构。偏离目标时先核对记录，再小幅调整总摄入。", "check": "体重趋势是否朝目标发展，训练是否仍可持续？两者不匹配时，不只盯着体重数字。", "ref": "SBS《终极饮食设置指南》p.25；《健身营养全书》p.21–22", "tags": "热量 维持 增肌 减脂", "deep": [{"title": "深入理解", "text": "SBS p.25 区分估计与观察：公式只能给出起点，实际消耗与身体反应决定后续调整。单日体重还包括水分与胃肠内容物变化，不能把变化全部等同于身体组织。", "kind": "资料归纳", "ref": "SBS《终极饮食设置指南》PDF p.25；《健身营养全书》PDF p.21–22"}, {"title": "操作流程", "text": "在相似条件记录体重，结合饮食执行形成趋势；同时记录工作组表现、饥饿感和日常活动变化。先确认摄入记录与活动相对稳定，再判断趋势是否偏离目标，并做小幅调整。", "kind": "综合应用", "ref": "SBS《终极饮食设置指南》PDF p.25；《健身营养全书》PDF p.21–22"}, {"title": "误区与边界", "text": "避免把体重乘一个系数输出为“你的真实维持热量”。短期增重不自动等于增脂，体重暂时不动也不自动证明摄入没作用。调得太频繁会让观察窗口失去意义。", "kind": "辨析与限制", "ref": "SBS《终极饮食设置指南》PDF p.25；《健身营养全书》PDF p.21–22"}, {"title": "情境示例", "text": "假如周末饮食量和盐分变化后体重短暂上升，先回到平时条件观察，而不是马上大幅削减饮食。此例说明记录条件的重要性，并不保证某次体重变化一定来自水。", "kind": "教学示例，非个体处方", "ref": "SBS《终极饮食设置指南》PDF p.25；《健身营养全书》PDF p.21–22"}]}, {"cat": "recovery", "id": "protein", "title": "营养 · 蛋白质看全天，也看适用条件", "lead": "常用范围是参考起点，不是人人同样的精确需求。", "why": "SBS 给出每日 1.6–2.2 克/公斤的常用范围，其前提包括力量训练、促进肌肉增长或维持、没有很大热量赤字及文中描述的一般体脂范围。", "observe": "先观察饮食总量与食物来源，而不是只问练后喝不喝粉。较大赤字或特殊健康情况不直接套这个范围。", "act": "将合适的蛋白质食物分配到日常进食中，优先长期执行。植物性饮食关注足量和来源互补；补剂只是一种便利形式。", "check": "能否稳定达到自己的饮食安排，且没有为了凑蛋白把其他食物全部挤掉？", "ref": "SBS《终极饮食设置指南》p.10、25", "tags": "蛋白质 乳清 素食", "deep": [{"title": "深入理解", "text": "原文 p.25–26 在常见阻力训练语境中给出每日 1.6–2.2 g/kg，并讨论体脂、赤字与训练类型会改变建议。它还提到分配到 3–6 次进食、每次至少约 0.3 g/kg 的方式；这些是原书建议，不意味着必须精准卡点。", "kind": "资料归纳", "ref": "SBS《终极饮食设置指南》PDF p.10、25–27"}, {"title": "操作流程", "text": "先估计全天通常摄入，再决定是否需要增加普通食物或便利补充。总摄入稳定后，再按生活安排分配进食，不因错过某个时间窗口而放弃整天饮食。特殊医疗情况按专业营养建议处理。", "kind": "综合应用", "ref": "SBS《终极饮食设置指南》PDF p.10、25–27"}, {"title": "误区与边界", "text": "不将原书讨论的极端范围当成普通训练者追求的目标。总身体质量与去脂体重是不同计算口径，不能混用后宣称同一个数值更科学。补剂也不具备替代完整食物结构的优先地位。", "kind": "辨析与限制", "ref": "SBS《终极饮食设置指南》PDF p.10、25–27"}, {"title": "情境示例", "text": "计算示例：若一位 80 kg、符合原文一般前提的健康训练者使用 1.6–2.2 g/kg 作为起点，得到 128–176 g/天。这只是展示范围计算，不能单凭体重确定个人需要取上限。", "kind": "教学示例，非个体处方", "ref": "SBS《终极饮食设置指南》PDF p.10、25–27"}]}, {"cat": "recovery", "id": "carb", "title": "营养 · 碳水与训练容量互相关联", "lead": "大容量训练时，不能只检查蛋白质。", "why": "肌糖原支持高强度活动，训练量与饮食限制会影响补充条件。训练越来越难，可能与恢复资源不匹配有关，但不能仅凭累就诊断缺碳水。", "observe": "记录高容量阶段的摄入、组间表现和主观难度。区分总体能量不足与单一营养素的猜测。", "act": "确保整体饮食与训练目标相容，在满足其他需求后安排支持训练且能接受的碳水来源。没有必要照搬统一克数。", "check": "相近训练任务的完成与恢复趋势是否改善？控制其他变化，避免把所有进步都归因于一个食物。", "ref": "《力量训练原理》p.70；《健身营养全书》p.21–22", "tags": "碳水 糖原 容量", "deep": [{"title": "深入理解", "text": "《力量训练原理》p.70 把肌糖原与较高强度训练、组间恢复和高容量完成联系起来，并指出总容量很高且饮食受限时，补充条件可能更紧张。因此恢复评估不应只问蛋白质是否足够。", "kind": "资料归纳", "ref": "《力量训练原理》PDF p.70；《健身营养全书》PDF p.21–22"}, {"title": "操作流程", "text": "先把总能量、蛋白质和训练量摆在一起看。如果增加训练量同时减少整体进食，先识别这一组合变化，再考虑调整碳水或总体能量。记录相近任务下的完成和主观难度，而不是靠一天感觉选极端饮食。", "kind": "综合应用", "ref": "《力量训练原理》PDF p.70；《健身营养全书》PDF p.21–22"}, {"title": "误区与边界", "text": "疲劳不能直接诊断糖原不足，补一顿碳水后表现改善也不能排除休息、情绪或任务熟悉度的作用。此材料不支持为所有训练量统一设置同样碳水克数。", "kind": "辨析与限制", "ref": "《力量训练原理》PDF p.70；《健身营养全书》PDF p.21–22"}, {"title": "情境示例", "text": "高容量阶段开始后，某人同时为减脂大幅少吃，后续组越来越难完成。应先评估训练与饮食目标是否冲突，而不是只增加蛋白粉，期待它解决全部能量与容量问题。", "kind": "教学示例，非个体处方", "ref": "《力量训练原理》PDF p.70；《健身营养全书》PDF p.21–22"}]}, {"cat": "recovery", "id": "fatwater", "title": "营养 · 脂肪、补水与食物质量", "lead": "能量充足不等于饮食完整。", "why": "脂肪参与细胞结构与脂溶性维生素吸收，水和微量营养素也不能被蛋白质替代。按体重设置脂肪下限的方法本身有适用局限。", "observe": "看饮食是否过度单一、是否长期把某类食物清零，以及环境和出汗是否改变。", "act": "保留多样化的日常食物与规律饮水；根据环境、出汗和个人情况调整。不要把统一升数或每公斤脂肪下限当成所有人的硬指标。", "check": "饮食能否长期执行，并支持正常生活和训练？如果恢复有问题，先检查基础，而非优先购买更多补剂。", "ref": "SBS《终极饮食设置指南》p.10、27；《健身营养全书》p.21–22", "tags": "脂肪 水 营养质量", "deep": [{"title": "深入理解", "text": "SBS p.27 将 20%–35% 总能量作为某些中等能量摄入情境下的脂肪参考，同时对按体重设置绝对下限提出局限。脂肪、碳水和蛋白质的安排互相占用能量预算，不能只最大化其中一种。", "kind": "资料归纳", "ref": "SBS《终极饮食设置指南》PDF p.27；《健身营养全书》PDF p.21–22"}, {"title": "操作流程", "text": "先检查饮食有没有长期清零某类食物，再检查来源是否过度单一。补水结合环境、出汗和日常饮食观察；长期不适或特殊健康情况寻求专业建议。本库不把统一饮水升数作为个人处方。", "kind": "综合应用", "ref": "SBS《终极饮食设置指南》PDF p.27；《健身营养全书》PDF p.21–22"}, {"title": "误区与边界", "text": "固定百分比在很低或很高总能量下可能失真；按体重线性计算也可能在不同体脂条件下产生不合理结果。水和微量营养素不能由更多热量替代，蛋白质也不能包办所有营养任务。", "kind": "辨析与限制", "ref": "SBS《终极饮食设置指南》PDF p.27；《健身营养全书》PDF p.21–22"}, {"title": "情境示例", "text": "教学计算：如果总能量为 2400 kcal，按 25% 分配脂肪，对应约 67 g（2400×0.25÷9）。这只解释比例如何转成克数，不表示 2400 kcal 或 25% 适合当前读者。", "kind": "教学示例，非个体处方", "ref": "SBS《终极饮食设置指南》PDF p.27；《健身营养全书》PDF p.21–22"}]}, {"cat": "recovery", "id": "life", "title": "恢复 · 睡眠、生活压力与训练共用预算", "lead": "恢复不足时，计划纸面上“合理”也可能不适合当下。", "why": "训练成本发生在真实生活中。工作、作息与饮食变化可能改变个人对同样训练的反应；疲劳不是只能靠意志解决。", "observe": "记录睡眠规律、白天困倦、生活负担及多次训练的表现变化。单次精神不佳不足以解释所有波动。", "act": "先稳定可控的作息与进食条件。忙碌阶段保留重点动作、减少低价值额外负担，必要时放慢进阶。", "check": "在相近条件下重新比较完成质量。不要因为某天睡得好，就立刻把积累的训练负担全补回来。", "ref": "《力量训练原理》PDF p.84–85、189–190", "tags": "睡眠 压力 恢复预算", "deep": [{"title": "深入理解", "text": "原书区分训练能力与恢复能力：能在一次训练中完成更多，不保证能从中恢复。p.84–85 讨论营养、睡眠、生活压力与经验如何改变可承受训练量；p.189–190 进一步说明同一个人在不同时期也会有差异。", "kind": "资料归纳", "ref": "《力量训练原理》PDF p.84–85、189–190"}, {"title": "操作流程", "text": "使用简短恢复日志：作息是否规律、白天是否困倦、工作生活负担是否突然上升，以及多项训练是否同步下降。先调整可控基础条件；忙碌阶段减少低价值额外训练，维持核心任务，不追补所有漏练。", "kind": "综合应用", "ref": "《力量训练原理》PDF p.84–85、189–190"}, {"title": "误区与边界", "text": "不把主观疲劳量表当成诊断，也不依据一次差睡就认定整堂训练无效。本材料的相关章节不能支持用统一睡眠时数保证恢复，更不能把补剂当成生活条件的替代。", "kind": "辨析与限制", "ref": "《力量训练原理》PDF p.84–85、189–190"}, {"title": "情境示例", "text": "如果同样训练量在假期能恢复，在连续加班时却反复下降，这不说明原计划绝对错误，而说明个体内条件变了。应让当下剂量与资源匹配，而不是证明自己意志变差。", "kind": "教学示例，非个体处方", "ref": "《力量训练原理》PDF p.84–85、189–190"}]}, {"cat": "recovery", "id": "returnvolume", "title": "恢复 · 高峰之后重新建立工作能力", "lead": "“以前做过”不代表现在可以立即恢复旧训练量。", "why": "长期低次数或比赛冲刺后，高次数专项能力可能暂时下降。回到大量训练需要过渡，而不是以过去最好时期作为第一周标准。", "observe": "记录停练、比赛或低量阶段的长度，以及重新训练后的动作质量和后续反应。", "act": "先用保守负荷与可完成量熟悉目标训练，再逐步恢复。新变式同样需要适应，不把主项经验直接当成新动作能力。", "check": "单次能做完还不够，要看下一次是否仍可稳定训练。", "ref": "JTS《力量举计划设计手册》p.20；SBS《旅程》p.46", "tags": "回归 容量 过渡", "deep": [{"title": "深入理解", "text": "JTS p.20 的例子是，数周几乎只做低次数冲刺、比赛后再休息，随后立即恢复大量八次组，容易出现工作能力不匹配。SBS《旅程》p.46 则把休赛期专项工作能力作为后续较重训练的准备。", "kind": "资料归纳", "ref": "JTS《力量举计划设计手册》PDF p.20；SBS《旅程》PDF p.46"}, {"title": "操作流程", "text": "先列近期实际训练历史，而不是回忆过去最高量。从能连续恢复的负担开始，逐步接触下一阶段的组次与动作。每次只明显增加一个需求维度，并观察后续训练，而非只问本次能否勉强做完。", "kind": "综合应用", "ref": "JTS《力量举计划设计手册》PDF p.20；SBS《旅程》PDF p.46"}, {"title": "误区与边界", "text": "工作能力过渡不是伤病康复的完整方案。经历受伤、手术或疾病后需要相应专业评估；不能用竞技训练的过渡周逻辑推定组织已经可以承受相同负荷。", "kind": "辨析与限制", "ref": "JTS《力量举计划设计手册》PDF p.20；SBS《旅程》PDF p.46"}, {"title": "情境示例", "text": "一位比赛后恢复训练的人，即使最大力量仍接近原水平，也可能不适应高次数多组。降低初期容量并逐步重建，比用一次大重量完成来证明“完全恢复”更符合阶段任务。", "kind": "教学示例，非个体处方", "ref": "JTS《力量举计划设计手册》PDF p.20；SBS《旅程》PDF p.46"}]}, {"cat": "injury", "id": "redflags", "title": "伤病排查 · 先识别需要就医的信号", "lead": "明显外伤或神经症状，优先医疗评估。", "why": "训练工具不能判断是否存在严重损伤。出现关键警示信号时，不用轻重量试举验证安全。", "observe": "背痛伴双腿麻木或无力、会阴感觉改变、大小便控制改变，或严重事故后背痛，应立即寻求急诊评估。", "act": "受伤后明显变形、肢端发冷或变色、麻木，也应急诊处理；明显肿胀、疼痛加重、无法负重或发热，应尽快就医。", "check": "这些信号用于分流，不能据此自诊病名；没有警示信号也不保证一定可以继续大重量训练。", "ref": "NHS：Back pain；Sprains and strains（2026-11-08 核对）", "tags": "红旗 麻木 外伤 急诊", "deep": [{"title": "深入理解", "text": "伤病模块先进行风险分流，再讨论训练。NHS 所列警示信号帮助识别何时需要医疗处理；它们不是用来在家确认具体损伤，也不意味着没有这些信号就能排除所有问题。", "kind": "资料归纳", "ref": "NHS《Back pain》“Immediate action required / Urgent advice”；NHS《Sprains and strains》对应就医段落；2026-11-08 核对"}, {"title": "操作流程", "text": "先问是否有严重事故或明显外伤，再问新出现的感觉、力量、大小便或功能变化。出现文中急诊信号时停止训练并求助当地急救或急诊服务；明显加重、发热或无法负重时及时评估。", "kind": "综合应用", "ref": "NHS《Back pain》“Immediate action required / Urgent advice”；NHS《Sprains and strains》对应就医段落；2026-11-08 核对"}, {"title": "误区与边界", "text": "这些信号的紧急程度不能靠“热身后好一点”降级。也不要靠另一种姿势能完成轻量动作来推断问题不严重。本页不给出止痛药或伤情确诊建议。", "kind": "辨析与限制", "ref": "NHS《Back pain》“Immediate action required / Urgent advice”；NHS《Sprains and strains》对应就医段落；2026-11-08 核对"}, {"title": "情境示例", "text": "一名训练者背痛后出现双腿无力或会阴感觉变化，应优先急诊评估；不是先在杠下试轻重量，看换相扑或戴腰带能否完成。", "kind": "教学示例，非个体处方", "ref": "NHS《Back pain》“Immediate action required / Urgent advice”；NHS《Sprains and strains》对应就医段落；2026-11-08 核对"}]}, {"cat": "injury", "id": "painrecord", "title": "伤病排查 · 记录症状，不用姿势猜病名", "lead": "位置、时间、诱发条件与功能变化，比“我是不是某某病”更有用。", "why": "同一疼痛位置可能有不同原因。动作视频可以记录运动表现，不能确认组织损伤；酸痛也不能用来证明动作完全安全。", "observe": "记录突然还是逐渐出现、在哪个动作与阶段发生、是否肿胀、麻木或无力，以及是否影响走路、抬手等日常活动。", "act": "先排查警示信号；暂停明显加重症状的任务。向医生或物理治疗专业人员提供记录，特别是持续、加重或功能受限时。", "check": "症状和功能是否持续改善？若没有，不因“能忍”而继续测试极限。", "ref": "NHS：Back pain；Sprains and strains；综合记录框架", "tags": "疼痛 酸痛 诊断", "deep": [{"title": "深入理解", "text": "疼痛部位、诱发动作与组织病名之间没有简单的一对一对应。本库只能帮助整理训练情境；持续或变化的症状需要临床评估。NICE NG59 1.1.1 明确要求在新发或改变的症状下考虑其他原因。", "kind": "资料归纳", "ref": "NICE NG59 1.1.1（新发或改变症状）；NHS《Back pain》《Sprains and strains》就医建议；记录表为综合应用"}, {"title": "操作流程", "text": "记录五项：出现方式、具体位置、相关动作与阶段、日常功能、随时间变化。把“痛”与麻木、无力、明显肿胀等分别写明。提供近期训练加量、外伤或既往诊断等背景，而不是只提供一个分数。", "kind": "综合应用", "ref": "NICE NG59 1.1.1（新发或改变症状）；NHS《Back pain》《Sprains and strains》就医建议；记录表为综合应用"}, {"title": "误区与边界", "text": "一个疼痛评分不应单独决定训练去留；症状趋势、功能和危险信号同样重要。某个动作暂时不痛也不能被当成原问题已经解决。不要根据本文自行确定病名。", "kind": "辨析与限制", "ref": "NICE NG59 1.1.1（新发或改变症状）；NHS《Back pain》《Sprains and strains》就医建议；记录表为综合应用"}, {"title": "情境示例", "text": "“右肩卧推触胸时不适，日常抬手也受限，近几次持续加重”比“肩袖不好”更有信息量。前者能帮助评估人员理解任务，后者可能只是未经确认的标签。", "kind": "教学示例，非个体处方", "ref": "NICE NG59 1.1.1（新发或改变症状）；NHS《Back pain》《Sprains and strains》就医建议；记录表为综合应用"}]}, {"cat": "injury", "id": "adjust", "title": "训练调整 · 先停止加重症状的任务", "lead": "保留活动的前提，是它符合当前情况且没有让症状恶化。", "why": "急性扭伤拉伤与一般背痛的处理不完全相同：前者早期可能需要保护，后者通常不建议长期卧床。不能统一下达“继续练”或“完全不动”。", "observe": "先分清是否刚发生外伤、有无明显肿胀或功能变化。已确诊或术后情况按专业方案执行。", "act": "对非急性、无警示信号且可活动的情况，可在专业建议下考虑降低负荷、减少量、调整幅度或换更易耐受动作；若症状加重就停止该任务。", "check": "不只看训练当时，也观察之后和日常功能。急性受伤或反应变差时先评估，不继续寻找更重的“无痛姿势”。", "ref": "NHS：Back pain；Sprains and strains；训练变量调整为综合框架", "tags": "降重 幅度 替代 负荷", "deep": [{"title": "深入理解", "text": "一般腰背痛与刚发生的扭伤拉伤不能套同一模板。NHS 对前者强调避免长期卧床，对后者早期讨论保护与相对休息；NICE NG59 1.2.1–1.2.2 强调按需求与能力提供活动及运动支持。", "kind": "资料归纳", "ref": "NHS《Back pain》《Sprains and strains》自我管理段落；NICE NG59 1.2.1–1.2.2；训练变量表为综合框架"}, {"title": "操作流程", "text": "先确认没有需要优先评估的情况。对允许活动且已有专业建议的情境，逐项考虑负荷、组数、幅度、速度、频率与动作替代。先从最明显加重症状的任务退开，观察当时、之后及日常功能的反应。", "kind": "综合应用", "ref": "NHS《Back pain》《Sprains and strains》自我管理段落；NICE NG59 1.2.1–1.2.2；训练变量表为综合框架"}, {"title": "误区与边界", "text": "“继续活动”不等于继续大重量，也不意味着必须练原动作；“休息”也不一定等于完全停止所有活动。没有材料支持一条统一疼痛分数或统一 24 小时阈值覆盖所有伤情，因此此处不设自动放行规则。", "kind": "辨析与限制", "ref": "NHS《Back pain》《Sprains and strains》自我管理段落；NICE NG59 1.2.1–1.2.2；训练变量表为综合框架"}, {"title": "情境示例", "text": "如果原动作某个幅度明显加重症状，不应只把重量降一点就强行完成原量。是否调整幅度、换任务或暂停，需要结合伤情与专业建议，不能只看哪个替代动作更能练到目标肌肉。", "kind": "教学示例，非个体处方", "ref": "NHS《Back pain》《Sprains and strains》自我管理段落；NICE NG59 1.2.1–1.2.2；训练变量表为综合框架"}]}, {"cat": "injury", "id": "regional", "title": "常见部位不适 · 用任务调整代替病因猜测", "lead": "肩、肘、膝、腰不适先看诱发条件与整体负担。", "why": "握距、站距、幅度、负荷与近期加量都可能改变某个任务的耐受，但哪个变量相关需要观察，不代表某种姿势天然有伤。", "observe": "肩肘：记录是否在出杠、下放或伸肘出现；膝髋：记录是否在某个幅度或特定站距出现；腰背：记录是否与起拉、支撑或训练后有关。", "act": "有警示信号先就医。没有明显外伤时，先停下加重症状的任务，再谨慎寻找可接受的轻量活动；不要用强拉伸、反复重试或一套固定纠正动作覆盖所有人。", "check": "若不适持续、加重、影响功能或出现麻木无力，寻求专业评估。动作替代能完成并不等于原问题已经解决。", "ref": "NHS：Back pain；Sprains and strains；三大项任务分析框架", "tags": "肩痛 肘痛 膝痛 腰痛", "deep": [{"title": "深入理解", "text": "按部位整理信息的用途，是把症状与任务需求联系起来，并不是把“肩前痛”“膝前痛”直接映射到一种疾病。深蹲、卧推和硬拉的阶段分析可以帮助描述什么时候发生变化，但不能从这种描述推出受损组织。", "kind": "资料归纳", "ref": "NHS《Sprains and strains》就医与自我管理段落；NICE NG59 1.1.1（新症状需重新评估）；任务记录为本库综合整理"}, {"title": "操作流程", "text": "肩肘记录出杠、离心、触胸、推起或伸肘；膝髋记录下降、底部、起身与走路；腰背记录支撑、起拉、锁定及日常弯腰。同步记录是否突然加量、新变式、明显外伤或日常功能变化，供进一步评估。", "kind": "综合应用", "ref": "NHS《Sprains and strains》就医与自我管理段落；NICE NG59 1.1.1（新症状需重新评估）；任务记录为本库综合整理"}, {"title": "误区与边界", "text": "不提供“某处痛就练某个纠正动作”的统一表。症状反复或加重时，不以不断换动作代替评估，也不靠高强度拉伸、按摩或忍痛重试来证明训练意志。", "kind": "辨析与限制", "ref": "NHS《Sprains and strains》就医与自我管理段落；NICE NG59 1.1.1（新症状需重新评估）；任务记录为本库综合整理"}, {"title": "情境示例", "text": "两人都说膝部不适，一人发生于扭伤后且无法负重，另一人只在新增加量的动作中出现。两种情境不能共享一个下肢训练替代方案，先分流再讨论训练。", "kind": "教学示例，非个体处方", "ref": "NHS《Sprains and strains》就医与自我管理段落；NICE NG59 1.1.1（新症状需重新评估）；任务记录为本库综合整理"}]}, {"cat": "injury", "id": "return", "title": "回归训练 · 先恢复任务，再恢复成绩", "lead": "回归标准基于功能与反应，不用固定天数承诺。", "why": "不同伤情的恢复时间差别很大。无痛完成一次轻练不等于已经恢复旧的训练量和极限负荷。", "observe": "关注日常功能、动作控制、轻量任务与之后的反应。已诊断伤病、术后或反复发作，按专业评估推进。", "act": "遵循已有医疗建议；在适合恢复训练时，先用可耐受任务建立稳定重复，再逐步增加需求，避免同时大幅增加重量、组数和频率。", "check": "连续几次是否都能完成且症状和功能没有变差？反复恶化就退回并重新评估，不硬追原纪录。", "ref": "NHS：Sprains and strains；JTS p.20（工作能力过渡）；综合回归框架", "tags": "复训 康复 复发", "deep": [{"title": "深入理解", "text": "回归训练需要区分日常功能、低需求任务和原有训练能力。轻负荷可完成只提供当前任务的信息，不能直接放行过去的重量、组次或比赛尝试。已诊断伤情应按专业评估的阶段推进。", "kind": "资料归纳", "ref": "NHS《Sprains and strains》恢复与进一步求助建议；JTS PDF p.20（仅限训练工作能力过渡）；回归步骤为综合框架"}, {"title": "操作流程", "text": "与专业人员明确允许任务和限制，先恢复可接受的稳定重复。逐步增加任务需求时保留记录：做了什么、即时反应、之后反应、日常功能。若出现持续恶化或新症状，退回并重新评估。", "kind": "综合应用", "ref": "NHS《Sprains and strains》恢复与进一步求助建议；JTS PDF p.20（仅限训练工作能力过渡）；回归步骤为综合框架"}, {"title": "误区与边界", "text": "本库不给统一伤后第几天加重或固定几周恢复旧纪录的承诺。JTS 的过渡周仅用于解释工作能力重建；它不能作为伤后组织愈合时间表。不要把“无痛”与“所有能力恢复”画等号。", "kind": "辨析与限制", "ref": "NHS《Sprains and strains》恢复与进一步求助建议；JTS PDF p.20（仅限训练工作能力过渡）；回归步骤为综合框架"}, {"title": "情境示例", "text": "从轻量动作回到正常训练时，先增加重量还是容量，应结合已获建议和当前最受限任务。一次只明显推进一个维度，能帮助识别是强度、总量还是频率让反应变差。", "kind": "教学示例，非个体处方", "ref": "NHS《Sprains and strains》恢复与进一步求助建议；JTS PDF p.20（仅限训练工作能力过渡）；回归步骤为综合框架"}]}, {"cat": "practice", "id": "session", "title": "把知识带进训练 · 每次只抓一个重点", "lead": "一堂训练先有任务，再有重量。", "why": "动作学习需要清晰反馈，过多提示会让执行目标混乱。主项、变式和辅助的价值应在同一目标下评价。", "observe": "训练前写一个重点：触点、底部控制、起拉张力或工作组稳定完成。训练中记录最相关证据。", "act": "逐步热身并观察当天状态；工作组保留可控执行；训练后写下是否完成重点，以及下次保留还是调整。", "check": "如果整堂训练无法回答“我在改善什么”，先减少不必要动作与提示。", "ref": "《力量举全书》p.159–160；《力量训练原理》p.20", "tags": "实践 热身 日志", "deep": [{"title": "深入理解", "text": "一堂训练中的学习顺序应从主要任务到细节。《力量举全书》p.159–160 讨论整体示范、分解与再整合，以及一次避免过多学习内容。提示过多时，训练者可能无法知道自己究竟改变了什么。", "kind": "资料归纳", "ref": "《力量举全书》p.159–160；《力量训练原理》p.20"}, {"title": "操作流程", "text": "训练前写当天一个关键任务；热身时逐渐接近正式动作要求，观察设置和位置。正式组只抓最有价值的提示，保留几段可比较录像。训练后将实际完成、主要现象和下一次安排用简短语句连接。", "kind": "综合应用", "ref": "《力量举全书》p.159–160；《力量训练原理》p.20"}, {"title": "误区与边界", "text": "热身不是越复杂越全面，辅助激活也不能自动保证主项技术。新提示应在可控制负荷先理解，再逐步放进工作组；不要在最大尝试前同时更改多项设置。", "kind": "辨析与限制", "ref": "《力量举全书》p.159–160；《力量训练原理》p.20"}, {"title": "情境示例", "text": "当天重点是卧推触点，可保留同角度工作组视频并记录触点是否随组末漂移。若同时要求新握法、新脚位、新腿驱和新节奏，就失去了判断哪一个因素有效的机会。", "kind": "教学示例，非个体处方", "ref": "《力量举全书》p.159–160；《力量训练原理》p.20"}]}, {"cat": "practice", "id": "weekly", "title": "每周复盘 · 用少量高价值数据", "lead": "记录是为了做决定，不是为了堆数字。", "why": "数据只有在条件一致时才容易解释。训练量、表现与恢复需要互相对照，单一评分无法覆盖全部。", "observe": "看实际完成与计划是否一致、关键组表现、动作变化、体重趋势、恢复变化与不适情况。", "act": "按执行→技术→恢复→刺激的顺序排查。选一个下阶段重点，写下调整与复测条件。", "check": "复盘是否减少了盲目换动作和冲动加量？如果记录很多却没有决策，简化到真正影响下一步的信息。", "ref": "《计划致胜》p.14、20；《力量举全书》p.159", "tags": "周复盘 记录 反馈", "deep": [{"title": "深入理解", "text": "周复盘应把任务完成与训练反应连接起来，而不是仅统计总吨位。没有统一的动作标准，更多数字只会放大假精确；记录必须能影响下一轮的具体决策。", "kind": "资料归纳", "ref": "《计划致胜》p.14、20；《力量举全书》p.159"}, {"title": "操作流程", "text": "用固定五栏：实际执行、关键组表现、技术变化、恢复条件、需要关注的症状。先确认计划是否真的执行，再判断有没有必要修改。只选一个主要改变，记录它针对哪条证据以及下次如何复查。", "kind": "综合应用", "ref": "《计划致胜》p.14、20；《力量举全书》p.159"}, {"title": "误区与边界", "text": "不能把所有下降归因于恢复，也不能把每次进步都归因于上周新增的一个动作。训练经验积累需要长期记录与可被推翻的解释，而不是每周创造一个全新的理论。", "kind": "辨析与限制", "ref": "《计划致胜》p.14、20；《力量举全书》p.159"}, {"title": "情境示例", "text": "若一周两次卧推的后半程都明显变形，而总量近期增加，下一轮可以先恢复原负担检验；如果恢复后仍然在第一组出现相同触点问题，就需要把注意力更多转向设置与技术。", "kind": "教学示例，非个体处方", "ref": "《计划致胜》p.14、20；《力量举全书》p.159"}]}];
const categories=[['logic','01','力训底层逻辑','先分清能力、刺激与表现，建立负荷和适应的判断框架。'],['squat','02','深蹲动作框架','平衡与支撑 → 底部控制 → 起身策略 → 卡点突破。'],['bench','03','卧推动作框架','稳定支撑 → 触点与轨迹 → 离胸、中段和锁定。'],['deadlift','04','硬拉动作框架','风格适配 → 起始张力 → 离地、过膝与锁定。'],['diagnosis','05','弱点诊断与突破','把观察变成可检验的假设，再用主项表现验证。'],['recovery','06','营养及恢复','让摄入、作息与训练负担匹配，持续积累能力。'],['injury','07','伤病排查与调整','先分流风险，再讨论可接受任务与回归训练。'],['practice','08','训练中的实践','把知识带进每次训练和每周复盘。']];
const view=document.getElementById('view');let current='home';let localOK=true;function read(k,d){try{return JSON.parse(localStorage.getItem('strength_field_v1_'+k))??d}catch{localOK=false;return d}}function write(k,v){try{localStorage.setItem('strength_field_v1_'+k,JSON.stringify(v));return true}catch{localOK=false;return false}}let saved=read('saved',[]),done=read('done',[]),notes=read('notes',{});
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function category(id){return categories.find(c=>c[0]===id)}

const navItems=[['home','首页','⌂'],['logic','原理','◎'],['squat','三大项','Ⅱ'],['diagnosis','突破','↗'],['recovery','恢复','◈'],['injury','伤病','＋'],['more','更多','☷']];
function navRender(){nav.innerHTML=navItems.map(([id,label,ico])=>`<button data-go="${id}" class="${(id==='squat'?['squat','bench','deadlift'].includes(current):id===current)?'active':''}"><span>${ico}</span>${label}</button>`).join('')}
function intro(title,desc,kicker='KNOWLEDGE / 知识框架'){return `<div class="chapterintro"><div class="eyebrow">${kicker}</div><h1>${title}</h1><p>${desc}</p></div>`}
function home(){return `<div class="welcome"><span class="eyebrow">STRENGTH / KNOWLEDGE / PRACTICE</span><h1>把训练想明白，<br><em>再把力量练出来。</em></h1><p>从力学机制到训练决策，每篇配有深入讲解、操作流程、误区辨析与引用出处。</p><div class="thread"><span>原理</span><i>→</i><span>动作</span><i>→</i><span>反馈</span><i>→</i><span>调整</span></div></div><div class="stats"><div><b>5</b><span>核心模块</span></div><div><b>${KB.length}</b><span>知识主题</span></div><div><b>${done.length}</b><span>已读主题</span></div></div><button class="feature" data-go="clinic"><span class="featureicon">↗</span><div><small>从眼前的问题开始</small><strong>动作卡住了？按顺序找原因。</strong><p>选择项目与卡点，建立观察 → 假设 → 验证的证据链。</p></div><span>→</span></button><div class="sectionhead"><h2>力量训练 · 五个核心问题</h2><small>按顺序学习，也可直接进入</small></div><div class="homecards">${[['logic','01','力量如何提高','刺激、剂量、疲劳与长期适应','◎'],['squat','02','动作如何练好','深蹲 · 卧推 · 硬拉的完整框架','Ⅱ'],['diagnosis','03','瓶颈如何突破','弱点检查、最小实验与训练复盘','↗'],['recovery','04','恢复如何配合','营养、作息与训练负担的匹配','◈'],['injury','05','不适如何处理','风险分流、任务调整与回归训练','＋']].map(([id,n,t,d,ico])=>`<button class="homecard" data-go="${id}"><div class="cardtop"><span class="cardicon">${ico}</span><small>${n}</small></div><strong>${t}</strong><p>${d}</p><span class="cardfoot">进入模块 →</span></button>`).join('')}<button class="homecard" data-path="learn"><div class="cardtop"><span class="cardicon">≋</span><small>GUIDE</small></div><strong>从零系统学习</strong><p>按原理、动作、恢复与复盘串联阅读</p><span class="cardfoot">开始阅读 →</span></button></div><div class="message"><b>一个贯穿全库的方法</b><br>先观察现象，再提出假设；一次改变一个主要变量，最后回到主项验证。</div>`}
const related={logic:['strength','dose','specific','weekly'],squat:['sq-hiprise','sq-break','evidence','adjust'],bench:['bp-chest','bp-lock','evidence','protein'],deadlift:['dl-floor','dl-knee','evidence','deload'],diagnosis:['triage','experiment','dose','life'],recovery:['energy','protein','dose','weekly'],injury:['redflags','painrecord','adjust','return'],practice:['evidence','experiment','weekly','dose']};
function article(a,open=false){const rel=(related[a.cat]||[]).filter(id=>id!==a.id).slice(0,3);return `<details class="article" id="a-${a.id}" ${open?'open':''}><summary><div><b>${done.includes(a.id)?'<span class="readstatus" aria-label="已读"></span>':''}${esc(a.title)}</b><p>${esc(a.lead)}</p></div><span class="plus" aria-hidden="true">＋</span></summary><div class="articlebody">${[['为什么','why'],['先观察','observe'],['怎么做','act'],['如何验证','check']].map(([t,k])=>`<div class="block"><h3>${t}</h3><p>${esc(a[k])}<small class="inline-source">依据：${esc(a.ref)} · 归纳转述</small></p></div>`).join('')}${deepHTML(a)}<div class="experiment">带走一个原则：${esc(a.lead)}</div><div class="articleactions"><button class="smallbtn ${saved.includes(a.id)?'on':''}" data-save="${a.id}">${saved.includes(a.id)?'已收藏':'收藏条目'}</button><button class="smallbtn ${done.includes(a.id)?'on':''}" data-read="${a.id}">${done.includes(a.id)?'已读 ✓':'标为已读'}</button><button class="smallbtn" data-notetoggle="${a.id}" aria-expanded="false">我的笔记</button><button class="smallbtn" data-print="${a.id}">打印本篇</button></div><div id="note-${a.id}" hidden><label class="savednote" for="input-${a.id}">本机笔记</label><textarea class="notebox" id="input-${a.id}" data-note="${a.id}" placeholder="记录观察、假设、调整和复测结果…">${esc(notes[a.id]||'')}</textarea><span class="savednote" data-notestatus="${a.id}">${localOK?'输入后自动保存在当前浏览器':'本浏览器无法持久保存，请自行复制笔记'}</span></div><details class="ref"><summary>完整引用与使用边界</summary>参考：${esc(a.ref)}${a.cat==='injury'?' · <a href="https://www.nhs.uk/conditions/back-pain/" target="_blank" rel="noopener">NHS 背痛</a> / <a href="https://www.nhs.uk/conditions/sprains-and-strains/" target="_blank" rel="noopener">扭伤与拉伤</a> / <a href="https://www.nice.org.uk/guidance/ng59/chapter/recommendations" target="_blank" rel="noopener">NICE NG59</a>':''}<br>本文为综合转述与应用框架，不是原书逐字处方。</details><div class="articleactions">${rel.map(id=>{let x=KB.find(x=>x.id===id);return `<button class="smallbtn" data-article="${id}">关联：${esc(x.title.split(' · ')[0])} · ${esc(x.title.split(' · ').slice(1).join(' · ')||x.lead)} →</button>`}).join('')}</div></div></details>`}
const bridges={logic:'先理解力量与适应，再学会选择动作、组织剂量和安排阶段。',squat:'从平衡与支撑出发，沿下降、底部、起身找到重点，最后检验卡点假设。',bench:'从稳定支撑出发，连起触点、轨迹与腿驱，再分析离胸、中段和锁定。',deadlift:'先选风格与设置，再处理起拉、过膝和锁定，最后检查疲劳成本。',diagnosis:'先确认停滞，再建立证据链、选择小实验，用连续记录决定下一步。',recovery:'从总能量和食物结构出发，把营养与生活恢复放回训练负担中评价。',injury:'先识别就医信号，再记录症状与功能，最后讨论任务调整与回归。'};

function deepHTML(a){return `<section class="deepstudy"><div class="deephead">深度研读 <span>从原理到训练判断</span></div>${(a.deep||[]).map(s=>`<section class="deepunit"><h3>${esc(s.title)} <small>${esc(s.kind)}</small></h3><p>${esc(s.text)}</p><div class="inline-source">${esc(s.kind)}依据：${esc(s.ref)}${s.kind.includes('示例')?'；示例由本库编写，不是原书训练处方。':''}</div></section>`).join('')}</section>`}

function categoryView(id){const c=category(id),lift=['squat','bench','deadlift'].includes(id);let arr=KB.filter(a=>a.cat===id);if(id==='diagnosis')arr=[...arr,...KB.filter(a=>a.cat==='practice')];return intro(lift?'三大项动作框架':c[2],bridges[id]||c[3],lift?'动作技术 / 重难点 / 弱点突破':'知识主线 / '+c[2])+(lift?`<div class="lifttabs">${[['squat','深蹲'],['bench','卧推'],['deadlift','硬拉']].map(([k,t])=>`<button data-go="${k}" class="${k===id?'on':''}">${t}</button>`).join('')}</div>`:'')+(id==='injury'?'<div class="message alert">先看就医信号。训练调整不能代替伤情评估。</div>':'')+`<div class="chaptertoc"><b>本章阅读顺序</b>${arr.map((a,i)=>`<button data-article="${a.id}"><span>${String(i+1).padStart(2,'0')}</span>${esc(a.title.split(' · ').slice(1).join(' · ')||a.title)}</button>`).join('')}</div><div class="chapterbook">${arr.map(a=>article(a,true)).join('')}</div><div class="chapterend"><b>把本章放回训练全局</b><p>${id==='recovery'?'结合完成质量与表现趋势，检验恢复是否匹配训练。':id==='injury'?'在适合恢复训练时，逐步重新建立任务耐受。':'动作、剂量和恢复需要一起解释。用同标准下的表现检验调整。'}</p><button class="smallbtn" data-go="${id==='logic'?'squat':lift?'diagnosis':id==='diagnosis'?'recovery':'home'}">${id==='logic'?'下一步：三大项动作框架':lift?'下一步：弱点诊断与突破':id==='diagnosis'?'下一步：营养及恢复':'回到知识总览'} →</button></div>`}
function moreView(){return intro('阅读工具','收藏与笔记保留在当前浏览器。')+`<div class="morelist"><button data-go="saved">我的收藏 <span>→</span></button><button data-path="learn">系统学习路线 <span>→</span></button><button data-go="clinic">卡点排查台 <span>→</span></button><button data-go="sources">阅读说明与来源 <span>→</span></button></div>`}
const routes={learn:['strength','adapt','dose','sq-model','bp-model','dl-model','evidence','energy','life','weekly']};
function pathView(name){return intro('一条从理解到行动的路线','按顺序阅读，也可以从与你当前问题最相关的一篇开始。','READING PATH / 系统学习')+`<div class="articlelist">${routes[name].map(id=>article(KB.find(a=>a.id===id))).join('')}</div>`}
const scenarios={squat:[['臀先起 / 前倾','sq-hiprise','先看下降和底部是否已失衡，再比较轻重负荷。','如果轻负荷稳定、末次才变化，先管理难度和疲劳；若总在同阶段失位，再测试控制与能力假设。'],['底部起不来','sq-break','确认深度、支撑和底部张力是否一致。','稳定工作组与一次极限失败分开看。暂停用于测试底部控制，不能直接证明臀腿某块肌肉弱。'],['膝部 / 骨盆变化','sq-knee','观察变化幅度、负荷依赖与是否伴随不适。','只凭视频不能确认损伤。先看可控性与功能，不强行追求统一姿势。']],bench:[['离胸困难','bp-chest','先检查出杠、上背、触点与暂停后的张力。','同标准的暂停练习用于测试底部控制，再决定是否需要更多能力建设。'],['中段卡住','bp-lock','回看卡住之前的轨迹，是否先直上再突然向后。','中段是正常困难区之一，位置稳定后才测试专项能力假设。'],['锁定失败','bp-lock','看肘部运动与杠铃是否已回到有利位置。','不要直接把问题全部归因于三头；半程进步需要由完整卧推检验。']],deadlift:[['离地慢 / 髋先起','dl-floor','先区分传统与相扑，再看实际起拉位置。','相扑地面困难可能正常。用保守负荷重复设置，而非一味把髋压低。'],['膝附近卡住','dl-knee','检查前段髋位、杠是否绕膝及重心前移。','先修复前段到过膝的连接，再考虑增加分段能力。'],['锁定困难','dl-lock','先看是否重心偏前、站距过宽或杠离身体远。','先形成可完成的站直位置，再用辅助实验验证顶端能力。']]};let selectedLift='squat',selectedCase=0;
function clinic(){return intro('卡点排查台','选择项目和现象，得到检查顺序与验证方法。这里不自动判定弱肌或损伤。','OBSERVE → TEST → VERIFY')+`<div class="toolbox"><h2>你在哪个环节遇到困难？</h2><div class="choices">${[['squat','深蹲'],['bench','卧推'],['deadlift','硬拉']].map(([id,t])=>`<button class="choice ${selectedLift===id?'on':''}" data-lift="${id}" aria-pressed="${selectedLift===id}">${t}</button>`).join('')}</div><div class="choices">${scenarios[selectedLift].map((s,i)=>`<button class="choice ${selectedCase===i?'on':''}" data-case="${i}" aria-pressed="${selectedCase===i}">${s[0]}</button>`).join('')}</div><div class="toolresult"><span class="pill">训练假设，不是确诊</span><h3>${scenarios[selectedLift][selectedCase][0]}</h3><p><b>第一步 · </b>${scenarios[selectedLift][selectedCase][2]}</p><p><b>第二步 · </b>${scenarios[selectedLift][selectedCase][3]}</p><p><b>第三步 · </b>固定动作标准与观察角度，一次试一个改变，回到原主项复测。若出现疼痛或功能异常，先走伤病排查流程。</p><button class="smallbtn" data-article="${scenarios[selectedLift][selectedCase][1]}">阅读完整分析 →</button> <button class="smallbtn" data-article="evidence">学习证据链 →</button></div></div><div class="toolbox"><h2>排查时，把证据排成顺序</h2><div class="flowwrap"><table class="flowtable"><thead><tr><th>先问</th><th>提示</th><th>下一步</th></tr></thead><tbody><tr><td>标准一致吗？</td><td>幅度、停顿、器械、次数</td><td>先恢复可比条件</td></tr><tr><td>从哪一刻开始变化？</td><td>不只看失败的一帧</td><td>回溯设置和前一阶段</td></tr><tr><td>轻重、首尾有差别吗？</td><td>技术、负荷与疲劳共同参与</td><td>在可控条件复测</td></tr><tr><td>调整后主项改善吗？</td><td>变式成绩不等于主项迁移</td><td>保留有效工具或重审假设</td></tr></tbody></table></div></div>`}
function sources(){return intro('如何使用这本知识库','以真实材料为参考，以训练决策为结构；原则、经验与临床边界分开处理。','EDITORIAL NOTES / 阅读说明')+`<div class="toolbox"><h2>每篇条目的四个层次</h2><p>为什么：解释关系与适用边界。先观察：明确要收集的证据。怎么做：给出可尝试的调整。如何验证：回到原任务判断是否有效。</p><p>训练经验用于提出假设，不当成普遍因果。身体比例和动作风格允许差异；卡点与症状不直接映射到弱肌或病名。</p><h2>引用怎么读</h2><p>PDF 页码指从文件第一页开始计数的物理页，可能不同于印刷书页。“资料归纳”转述原文；“综合应用”是基于资料建立的操作流程；“辨析与限制”说明不能从资料推出什么；“教学示例”用于解释方法，不是作者处方或个体建议。不同版本 RPE、阶段组数与经验判断均保留原有语境。</p><h2>参考材料</h2><ul class="sources"><li>迈克·伊瑟泰尔、詹姆斯·霍夫曼、查德·韦斯利·史密斯：《力量训练原理：用七大核心原理科学提升力量》。引用重点：PDF p.18–20、42、48–51、70、84–85、171、189–190。</li><li>Mark Rippetoe：《力量训练基础》《力量训练计划》</li><li>Greg Nuckols：SBS《旅程》PDF p.24–25、41、46；《如何深蹲·终极指南》PDF p.58–63、66、78；《如何卧推·终极指南》PDF p.27、35、38–41、61–64、80；《如何硬拉·终极指南》PDF p.75、93、96–100。</li><li>鲍里斯·舍伊科：《力量举全书：深蹲、卧推及硬拉的理论与技术详解》。引用重点：PDF p.68、76、159–160、193。</li><li>Juggernaut《力量举诊断手册》PDF p.11–12、22；查德·韦斯利·史密斯 JTS《力量举计划设计手册》PDF p.16、20、67。</li><li>Mike Tuchscherer：《RTS 反应训练系统》（上传的早期版本）PDF p.15、56–57；Izzy Narvaez：《计划致胜》PDF p.14、20。</li><li>《西部杠铃·共轭训练法》与《Westside 共轭法用户指南》</li><li>SBS《终极饮食设置指南》；《健身营养全书》</li><li>伤病分流补充：<a href="https://www.nhs.uk/conditions/back-pain/" target="_blank" rel="noopener">NHS Back pain</a>；<a href="https://www.nhs.uk/conditions/sprains-and-strains/" target="_blank" rel="noopener">NHS Sprains and strains</a>；<a href="https://www.nice.org.uk/guidance/ng59/chapter/recommendations" target="_blank" rel="noopener">NICE NG59</a>，使用条款 1.1.1、1.2.1–1.2.2（2026-11-08 核对）。</li></ul><p class="sources">页码按上传 PDF 的物理页计算。重复的 Juggernaut 文件按同一来源使用。综合应用步骤属于本知识库的组织方式，不表示原书逐字结论或每位作者完全一致。</p></div><div class="toolbox"><h2>使用与隐私</h2><p>本文件无需联网即可阅读和排查。收藏、已读状态、笔记仅保存在当前浏览器，换设备、换打开路径或清理浏览器数据后可能无法保留。页面不连接 AI 服务、不上传输入内容。外部医疗链接需要联网。</p><button class="smallbtn" id="exportNotes">导出笔记备份</button><p id="exportStatus" class="savednote" role="status"></p></div>`}
function render(){navRender();if(current==='home'){view.innerHTML=home()}else if(current==='more')view.innerHTML=moreView();else if(category(current))view.innerHTML=categoryView(current);else if(current==='clinic')view.innerHTML=clinic();else if(current==='learn')view.innerHTML=pathView('learn');else if(current==='sources')view.innerHTML=sources();else if(current==='saved'){const arr=KB.filter(a=>saved.includes(a.id));view.innerHTML=intro('我的收藏','把与你当前训练最相关的知识保留在这里。','PERSONAL INDEX / 本机收藏')+(arr.length?'<div class="articlelist">'+arr.map(a=>article(a)).join(''):'<div class="empty">还没有收藏。打开任意知识条目，点击“收藏条目”。</div>')}document.getElementById('crumb').textContent='FIELD GUIDE / '+(category(current)?.[2]||({home:'总览',clinic:'卡点排查',learn:'学习路线',sources:'阅读说明',saved:'我的收藏'}[current]||'知识库'))}
function go(id){clearTimeout(timer);history.replaceState(null,'',location.pathname+location.search);if(!category(id)&&!['home','clinic','learn','sources','saved','more'].includes(id))id='home';current=id;document.getElementById('search').value='';render();window.scrollTo({top:0,behavior:'instant'})}
function openArticle(id){const a=KB.find(a=>a.id===id);if(!a)return;go(a.cat);const e=document.getElementById('a-'+id);e.open=true;e.scrollIntoView({behavior:'smooth',block:'start'});history.replaceState(null,'','#'+id)}
function search(q){q=q.trim();if(!q){render();return}const terms=q.toLowerCase().split(/\s+/).filter(Boolean);const scored=KB.map(a=>({a,score:terms.reduce((s,t)=>s+(a.title.toLowerCase().includes(t)?8:0)+([a.lead,a.why,a.observe,a.act,a.check,a.tags,...(a.deep||[]).map(s=>s.text)].join(' ').toLowerCase().includes(t)?1:0),0)})).filter(x=>x.score>0).sort((a,b)=>b.score-a.score);view.innerHTML=intro('搜索结果',`“${esc(q)}” · ${scored.length} 篇相关条目`,'SEARCH / 全文检索')+(scored.length?'<div class="articlelist">'+scored.map(x=>article(x.a)).join(''):'<div class="empty">没有匹配条目。可试试“臀先起”“触点”“离地”“RPE”或“疲劳”。</div>');document.getElementById('crumb').textContent='FIELD GUIDE / 搜索'}
function toggleArray(kind,id,button){const arr=kind==='saved'?saved:done;const at=arr.indexOf(id);at<0?arr.push(id):arr.splice(at,1);const ok=write(kind,arr);button.classList.toggle('on',arr.includes(id));button.textContent=kind==='saved'?(arr.includes(id)?'已收藏':'收藏条目'):(arr.includes(id)?'已读 ✓':'标为已读');if(!ok)button.textContent+=' · 本次会话';const head=document.querySelector('#a-'+id+' summary b');if(kind==='done'&&head){const a=KB.find(a=>a.id===id);head.innerHTML=(done.includes(id)?'<span class="readstatus" aria-label="已读"></span>':'')+esc(a.title)}}
function printArticle(id){const a=KB.find(a=>a.id===id);if(!a)return;const w=window.open('','_blank');if(!w){alert('请允许打印窗口，或使用浏览器打印当前页。');return}w.document.write('<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>'+esc(a.title)+'</title><style>body{font:15px/1.9 sans-serif;max-width:780px;margin:35px auto;padding:0 25px}h1{font-size:25px}h2{font-size:15px;color:#29483c}small{color:#666}</style><h1>'+esc(a.title)+'</h1><p>'+esc(a.lead)+'</p>'+[['为什么','why'],['先观察','observe'],['怎么做','act'],['如何验证','check']].map(([t,k])=>'<h2>'+t+'</h2><p>'+esc(a[k])+'</p>').join('')+(a.deep||[]).map(s=>'<h2>'+esc(s.title)+'</h2><p>'+esc(s.text)+'</p><small>依据：'+esc(s.ref)+'；'+esc(s.kind)+'</small>').join('')+(notes[id]?'<h2>我的笔记</h2><p style="white-space:pre-wrap">'+esc(notes[id])+'</p>':'')+'<small>参考：'+esc(a.ref)+'</small></html>');w.document.close();w.focus();setTimeout(()=>w.print(),250)}
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.go)go(b.dataset.go);else if(b.dataset.path)go('learn');else if(b.dataset.article)openArticle(b.dataset.article);else if(b.dataset.save)toggleArray('saved',b.dataset.save,b);else if(b.dataset.read)toggleArray('done',b.dataset.read,b);else if(b.dataset.notetoggle){let box=document.getElementById('note-'+b.dataset.notetoggle);box.hidden=!box.hidden;b.setAttribute('aria-expanded',!box.hidden);if(!box.hidden)box.querySelector('textarea').focus()}else if(b.dataset.print)printArticle(b.dataset.print);else if(b.dataset.lift){selectedLift=b.dataset.lift;selectedCase=0;view.innerHTML=clinic()}else if(b.dataset.case!==undefined){selectedCase=Number(b.dataset.case);view.innerHTML=clinic()}else if(b.id==='exportNotes'){const blob=new Blob([JSON.stringify({format:'strength-field-notes-v1',saved,done,notes},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='strength-field-notes.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);document.getElementById('exportStatus').textContent='已生成笔记备份下载。'}});
document.addEventListener('input',e=>{const id=e.target.dataset.note;if(!id)return;notes[id]=e.target.value;const ok=write('notes',notes);document.querySelector(`[data-notestatus="${id}"]`).textContent=ok?'已保存在当前浏览器':'无法持久保存，请复制笔记备份。'});
let timer;document.getElementById('search').addEventListener('input',e=>{clearTimeout(timer);let q=e.target.value;timer=setTimeout(()=>search(q),150)});document.getElementById('searchForm').addEventListener('submit',e=>{e.preventDefault();clearTimeout(timer);search(document.getElementById('search').value)});document.getElementById('clearSearch').onclick=()=>{clearTimeout(timer);document.getElementById('search').value='';render()};render();const initial=location.hash.slice(1);if(KB.some(a=>a.id===initial))openArticle(initial);

</script></body></html>
